<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行程">
<meta name="theme-color" content="#161a21">
<title>行程看板 · 2026-11-04</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1115;--panel:#161a21;--panel2:#1d222b;--ink:#e8ebf0;--dim:#8b94a3;--line:#252b36;
  --study:#4f8cff;--play:#f0a020;--life:#2dd4a7;--other:#a78bfa;--course:#8fa0c4;
  --red:#ff4d4f;--hot:#ff6b6b;--gold:#f5c542;--hh:46px;--head:40px;--strip:26px;
  --bar:calc(32px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: light){
  :root{--bg:#f4f5f7;--panel:#fff;--panel2:#f0f2f5;--ink:#1a1d23;--dim:#6b7280;--line:#e2e5ea;}
}
html,body{height:100%;overflow:hidden}
body{margin:0;position:fixed;inset:0;background:var(--bg);color:var(--ink);
  font:13px/1.4 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
.app{height:var(--app-h,100vh);display:flex;flex-direction:column;position:relative;
  overflow:hidden;overscroll-behavior:none}

/* ---------- 顶栏 ---------- */
.hdr{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--line);background:var(--panel);z-index:20}
.hdr .logo{font-size:13px;font-weight:800;letter-spacing:1px}
.hdr .dt{font-size:10px;color:var(--dim);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:center}
.hdr .hbtn.nav{padding:4px 6px;font-size:13px;line-height:1;min-width:24px;text-align:center}
.hnav{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:1px 2px;flex:none}
.hnav button{border:0;background:none;color:var(--ink);width:20px;height:20px;
  font-size:14px;line-height:1;border-radius:50%;padding:0}
.hnav span{font-size:9px;color:var(--dim);min-width:36px;text-align:center}
.hbtn{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font-size:10px;border-radius:999px;padding:4px 8px}
.hbtn.on{background:var(--study);border-color:var(--study);color:#08111f;font-weight:700}

/* ---------- 四列日历 ---------- */
.board{flex:1;min-height:0;display:grid;grid-template-columns:34px 1.30fr .81fr .81fr;
  overflow:hidden;overscroll-behavior:none;
  transition:grid-template-columns .28s cubic-bezier(.2,.7,.2,1)}
.board[data-expand="d0"]{grid-template-columns:34px 1.78fr .78fr .62fr}
.board[data-expand="d1"]{grid-template-columns:34px 1.02fr 1.74fr .62fr}
.board[data-expand="d2"]{grid-template-columns:34px 1.02fr .62fr 1.74fr}
.rail{position:relative;border-right:1px solid var(--line)}
.rail::after{content:"";position:absolute;right:-1px;top:calc(var(--head) + var(--strip));
  width:2px;height:var(--gh,552px);background:var(--red);z-index:12;pointer-events:none}
.rail-head{height:var(--head);position:sticky;top:0;z-index:8;background:var(--panel)}
.rail-pad{height:var(--strip);background:var(--panel);border-bottom:1px solid var(--line)}
.rail-body{position:relative;height:var(--gh,552px);background:var(--panel);
  box-shadow:0 -2px 0 var(--red)}
.rl{position:absolute;right:3px;left:auto;text-align:right;font-size:10px;
  line-height:1;color:var(--dim);transform:translateY(-6px);font-variant-numeric:tabular-nums}
.nowdot{position:absolute;right:0;left:auto;width:12px;height:2px;border-radius:1px;
  background:var(--red);transform:translateY(-1px);z-index:9}
.col{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);
  position:relative}
.col:last-child{border-right:0}
.col.wide .course .ct{flex:0 0 34%;font-size:7.5px}
.col.wide .course em{flex:1 1 66%;font-size:12px;font-weight:800;line-height:1.05}
.dhead{height:var(--head);position:sticky;top:0;z-index:8;background:var(--panel);
  padding:3px 4px 2px;cursor:pointer;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;user-select:none}
.dhead:active{background:var(--panel2)}
.dhead .dl{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:12px}
.dhead .dd{font-size:8px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.dhead .dexp{position:absolute;right:2px;bottom:3px;font-size:9px;color:var(--dim)}
.strip{height:var(--strip);display:flex;gap:3px;align-items:center;padding:0 2px;
  overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);
  background:var(--panel);scrollbar-width:none;flex:none}
.strip::-webkit-scrollbar{display:none}
.strip.empty{color:var(--dim);font-size:8px;justify-content:center}
.stripstat{flex:none;font-size:8px;color:var(--dim);padding:0 2px;white-space:nowrap}
.stripstat.full{color:var(--gold);font-weight:800}
.chip{flex:none;font-size:8.5px;line-height:1.6;padding:0 4px;border-radius:4px;
  border:1px solid var(--line);border-left-width:2px;color:var(--ink);
  background:var(--panel2);white-space:nowrap;max-width:78px;overflow:hidden;
  text-overflow:ellipsis}
.cat-study{border-left-color:var(--study)}
.cat-play{border-left-color:var(--play)}
.cat-life{border-left-color:var(--life)}
.cat-other{border-left-color:var(--other)}
.grid{position:relative;height:var(--gh,552px);flex:none;box-shadow:0 -2px 0 var(--red);
  background:repeating-linear-gradient(to bottom,
    transparent 0 calc(var(--hh,46px)/2 - 1px),
    color-mix(in srgb,var(--line) 45%,transparent) calc(var(--hh,46px)/2 - 1px) calc(var(--hh,46px)/2),
    transparent calc(var(--hh,46px)/2) var(--hh,46px)),
    repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh,46px)),
    var(--panel)}
.blk{position:absolute;left:1px;right:1px;border-radius:4px;pointer-events:none;z-index:1}
.blk.study{background:color-mix(in srgb,var(--study) 16%,transparent)}
.blk.play{background:color-mix(in srgb,var(--play) 16%,transparent)}
.blk i{position:absolute;top:0;left:3px;font-style:normal;font-size:7.5px;
  color:var(--dim);opacity:.85}
.course{position:absolute;left:1px;right:1px;z-index:2;border-radius:5px;
  padding:2px 4px;overflow:hidden;font-size:9px;line-height:1.12;color:var(--ink);
  font-weight:600;border-left:3px solid var(--course);
  background:color-mix(in srgb,var(--course) 22%,transparent);
  display:flex;flex-direction:column;justify-content:flex-start;gap:1px}
.course .ct{display:flex;align-items:center;width:100%;flex:1 1 50%;min-height:0;
  overflow:hidden;white-space:normal;word-break:break-word}
.course i{display:inline-block;font-style:normal;font-size:6px;font-weight:700;
  padding:0 2px;margin-right:2px;border-radius:2px;background:#0003;
  color:inherit;vertical-align:1px;flex:none}
.course em{display:flex;align-items:center;width:100%;flex:1 1 50%;min-height:0;
  font-style:normal;font-size:9px;font-weight:600;line-height:1.12;
  color:var(--ink);opacity:.95;white-space:normal;word-break:break-all;overflow:hidden}
.course.cc-red{background:#d32f2f;color:#fff;border-left-color:#8e1b1b}
.course.cc-red em{color:#ffe6e6;opacity:1}
.course.cc-pink{background:#ec407a;color:#fff;border-left-color:#ad1457}
.course.cc-pink em{color:#ffe3ee;opacity:1}
.course.cc-light{background:#ffcdd2;color:#6d1b1b;border-left-color:#e57373}
.course.cc-light em{color:#8e2424;opacity:1}
.course.cc-pale{background:#fff5f5;color:#a61b1b;border-left-color:#ef9a9a}
.course.cc-pale em{color:#b32424;opacity:1}
.lt.course{border-left-color:var(--course)}
.ev{position:absolute;left:2px;right:2px;z-index:3;border-radius:5px;padding:2px 4px;
  font-size:9px;line-height:1.1;overflow:hidden;cursor:pointer;
  border-left:3px solid var(--cat,var(--other));
  background:color-mix(in srgb,var(--cat,var(--other)) 28%,transparent);
  color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;gap:0}
.ev .evt{display:block;overflow:hidden}
.ev .evctl{position:absolute;right:2px;bottom:1px;display:flex;gap:2px;z-index:2}
.ev .evctl button{width:20px;height:20px;padding:0;line-height:1;font-size:13px;
  border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--ink)}
.ev.cat-study{--cat:var(--study)}
.ev.cat-play{--cat:var(--play)}
.ev.cat-life{--cat:var(--life)}
.ev.cat-other{--cat:var(--other)}
.ev b{font-size:7px;font-weight:400;color:var(--dim);white-space:nowrap}
.ev.touched{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 30%,transparent)}
.ev.in-class{left:16px;box-shadow:inset 0 0 0 1.5px #ffffff70}
.ev.in-class::after{content:"课内";position:absolute;top:1px;right:2px;font-size:6px;
  line-height:1.5;padding:0 2px;border-radius:2px;background:#0008;color:#fff}
.now{position:absolute;left:0;right:0;height:1.5px;background:var(--red);
  z-index:6;pointer-events:none}
.now .nowlab{position:absolute;right:1px;top:-12px;font-size:7.5px;color:#fff;
  background:var(--red);border-radius:3px;padding:0 3px;line-height:1.6}
.now.pin-top .nowlab{top:2px}
.late{height:20px;flex:none;display:flex;gap:3px;align-items:center;overflow-x:auto;
  padding:0 2px;border-top:2px solid var(--line);background:var(--panel);
  scrollbar-width:none}
.late::-webkit-scrollbar{display:none}
.lt{flex:none;font-size:7.5px;padding:0 4px;border-radius:3px;background:var(--panel2);
  border-left:2px solid var(--cat);white-space:nowrap;color:var(--ink)}
.lt-empty{font-size:7.5px;color:var(--dim)}
.grid.placing{outline:1px dashed var(--study);outline-offset:-2px;
  background-color:color-mix(in srgb,var(--study) 6%,transparent)}

/* ---------- 底部任务栏 ---------- */
.minibar{position:relative;flex:none;height:var(--bar);z-index:30;
  display:flex;align-items:center;gap:4px;padding:0 8px env(safe-area-inset-bottom);
  overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);
  scrollbar-width:none;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.minibar::-webkit-scrollbar{display:none}
.minibar .mb-l{flex:none;font-size:9px;color:var(--dim);font-weight:700}
.minibar .mchip{flex:none;font-size:9px;padding:1px 5px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.minibar .mb-x{flex:none;margin-left:auto;font-size:8px;color:var(--dim)}
.app[data-drawer="open"] .minibar{transform:translateY(110%)}
.drawer{position:absolute;left:0;right:0;bottom:0;height:66.67%;z-index:35;
  display:flex;flex-direction:column;background:var(--panel);
  border-top:1px solid var(--line);border-radius:14px 14px 0 0;
  box-shadow:0 -8px 26px #0007;transform:translateY(106%);
  transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.app[data-drawer="open"] .drawer{transform:translateY(0)}
.drawerbg{position:absolute;inset:0;z-index:34;background:transparent}
.drawerbg[hidden]{display:none}
.dtop{flex:none;height:42px;display:flex;align-items:center;gap:8px;
  padding:0 10px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--line)}
.dtop b{color:var(--ink);font-size:12px;flex:none}
.dtop .ver{flex:1;font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.dtop .dacts{flex:none;display:flex;gap:6px}
.dtop button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font-size:12px;border-radius:999px;padding:7px 14px;min-height:30px}
.dtop .addbtn{width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;
  background:var(--study);border-color:var(--study);color:#08111f;
  font-size:19px;font-weight:800;line-height:1}
.dbody{flex:1;overflow-y:auto;padding:2px 8px calc(26px + env(safe-area-inset-bottom))}
.syncbar{display:flex;align-items:center;gap:8px;margin:6px 0 2px;padding:8px 10px;
  border-radius:8px;font-size:11px;line-height:1.4}
.syncbar span{flex:1;min-width:0}
.syncbar button{flex:none;border-radius:7px;padding:6px 10px;font-size:11px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.syncbar.copynow{background:color-mix(in srgb,var(--study) 16%,var(--panel2));
  border:1px solid color-mix(in srgb,var(--study) 55%,transparent);color:var(--ink)}
.syncbar.copynow button{background:var(--study);border-color:var(--study);
  color:#08111f;font-weight:800}
.syncbar.wait{background:color-mix(in srgb,#f5b301 14%,var(--panel2));
  border:1px dashed #f5b301;color:var(--ink)}
.tag.wait{color:#3a2b00;background:#f5c542;font-weight:800}
.sec{margin-top:6px}
.sec h3{margin:5px 2px 3px;font-size:9px;font-weight:700;color:var(--dim);letter-spacing:1px}
.card{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;margin:5px 0;
  border-radius:8px;background:var(--panel2);border-left:3px solid var(--cat,var(--other))}
.card.decision{background:color-mix(in srgb,#3b82f6 12%,var(--panel2));
  border:1px dashed #3b82f6;border-left:3px solid #3b82f6}
.tag.dec{color:#fff;background:#3b82f6;font-weight:800}
.card.decision .cm{gap:5px}
.card.decision .cm button{font-size:10px;padding:5px 8px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.card.decision .cm button:first-of-type{background:#3b82f6;border-color:#3b82f6;
  color:#fff;font-weight:700}
.card.cat-study{--cat:var(--study)}
.card.cat-play{--cat:var(--play)}
.card.cat-life{--cat:var(--life)}
.card.cat-other{--cat:var(--other)}
.card.selected{outline:1.5px solid var(--study)}
.card.just{animation:cardin .32s ease}
@keyframes cardin{from{transform:translateY(-3px);opacity:.45}to{transform:none;opacity:1}}
.card.done{opacity:.65}
.card.done .ct{text-decoration:line-through}
.cb{flex:none;width:20px;height:20px;margin-top:1px;padding:0;position:relative;
  border:1.5px solid var(--dim);border-radius:5px;background:none;
  transition:background .18s,border-color .18s}
.cb.on{background:var(--study);border-color:var(--study)}
.cb.on::after{content:"✓";position:absolute;inset:0;font-size:13px;color:#fff;
  line-height:16px;text-align:center}
.cmain{min-width:0;flex:1}
.ct{font-size:13px;line-height:1.3;word-break:break-all}
.cm{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:3px}
.tag{font-style:normal;font-size:9px;padding:1px 4px;border-radius:3px;
  background:var(--bg);color:var(--dim);white-space:nowrap}
.tag.study{color:var(--study)}
.tag.play{color:var(--play)}
.tag.life{color:var(--life)}
.tag.big{color:var(--hot)}
.tag.new{color:#08111f;background:var(--study);font-weight:700}
.lenbox{display:flex;align-items:center;gap:4px;margin-left:auto}
.lenbox button{width:26px;height:26px;padding:0;font-size:15px;line-height:1;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px}
.len{font-size:10px;color:var(--dim);min-width:30px;text-align:center}
.placebtn{font-size:10px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);border-radius:5px;padding:5px 8px}
details.trash{margin:8px 0;border-top:1px solid var(--line);padding-top:6px}
details.trash summary{font-size:9px;color:var(--dim)}
.trow{display:flex;justify-content:space-between;gap:8px;font-size:10px;
  color:var(--dim);padding:2px 2px}
.trow i{font-style:normal;font-size:8px;flex:none}

/* ---------- 悬浮按钮 ---------- */
.dock{position:absolute;right:8px;bottom:calc(var(--bar) + 8px);z-index:40;
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;
  transition:bottom .3s cubic-bezier(.2,.7,.2,1)}
.dock .fab,.dock .copy{pointer-events:auto}
.app[data-drawer="open"] .dock{bottom:calc(66.67% + 8px)}
.copy{border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  font-size:10px;border-radius:999px;padding:7px 11px;box-shadow:0 4px 14px #0005;
  transition:all .25s}
.copy.on{color:#08111f;background:var(--study);border-color:var(--study);
  font-weight:800;box-shadow:0 4px 18px color-mix(in srgb,var(--study) 55%,transparent)}
.copy:disabled{opacity:.35;pointer-events:none}
.fab{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:18px;line-height:1;
  box-shadow:0 6px 20px #0008;position:relative;padding:0}
.fab i{position:absolute;top:-2px;right:-2px;font-style:normal;font-size:9px;
  background:var(--red);color:#fff;border-radius:999px;min-width:16px;height:16px;
  line-height:16px;padding:0 3px;text-align:center}
.fabdot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;
  background:var(--red);border:2px solid var(--panel);box-shadow:0 0 0 0 #ff4d4f88;
  animation:dotpulse 1.6s ease-out infinite}
@keyframes dotpulse{0%{box-shadow:0 0 0 0 #ff4d4f99}70%{box-shadow:0 0 0 7px #ff4d4f00}
  100%{box-shadow:0 0 0 0 #ff4d4f00}}

/* ---------- 浮层 ---------- */
.modal{position:absolute;inset:0;z-index:60;background:#000a;display:flex;
  align-items:flex-end;backdrop-filter:blur(2px)}
.modal[hidden]{display:none}
.sheet{width:100%;height:66.67%;max-height:66.67%;overflow:hidden;background:var(--panel);
  border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column}
.sheet.prompt{height:auto;max-height:62%}
.sheet .handle{flex:none;width:40px;height:4px;border-radius:2px;
  background:var(--line);margin:0 auto 10px}
.sheet .body{flex:1;min-height:0;overflow-y:auto;padding-bottom:4px}
.sheet h2{margin:0;font-size:20px;line-height:1.3;font-weight:800;word-break:break-all}
.sheet .loc{display:flex;align-items:baseline;gap:8px;margin-top:10px;
  font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
.sheet .loc span{flex:none;font-size:10px;font-weight:400;color:var(--dim)}
.sheet .meta{color:var(--dim);font-size:11px;margin:6px 0 8px;line-height:1.7}
.sheet .rows{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.sheet .row{display:flex;gap:10px;padding:7px 0;font-size:12px;line-height:1.45;
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.sheet .row i{flex:none;width:48px;font-style:normal;font-size:11px;color:var(--dim)}
.sheet .row b{min-width:0;font-weight:500;color:var(--ink);word-break:break-all}
.sheet .acts{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}
.sheet .acts button{flex:1;min-width:68px;padding:10px 6px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12px}
.sheet .acts button.primary{background:var(--study);border-color:var(--study);
  color:#08111f;font-weight:800}
.finput{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:16px;padding:0 12px;outline:none}
.frow{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.frow.time{align-items:flex-start;flex-wrap:nowrap}
.flabel{flex:none;width:34px;font-size:11px;color:var(--dim)}
.fchip{border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  border-radius:999px;padding:7px 12px;font-size:12px;min-height:34px;flex:none}
.fchip.on{background:var(--study);border-color:var(--study);color:#08111f;font-weight:800}
.fslots{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;flex:1;
  scrollbar-width:none}
.fslots::-webkit-scrollbar{display:none}
.fchip.slot{min-width:54px;text-align:center;padding:7px 8px}
.fchip.slot.busy{border-color:#ef9a9a;color:#ef9a9a}
.fchip.slot.past{opacity:.32}

    if(override) return true;
    return !c.weeks || !c.weeks.length || c.weeks.indexOf(week) >= 0;
  });
}
function courseClass(title){
  var s = String(title || '');
  if(s.indexOf('化工报国') >= 0) return 'cc-pale';
  if(s.indexOf('高等数学') >= 0 || s.indexOf('高数') >= 0 || s.indexOf('Python') >= 0) return 'cc-light';
  if(s.indexOf('英语') >= 0 || s.indexOf('制图') >= 0 || s.indexOf('工程图学') >= 0) return 'cc-red';
  if(s.indexOf('大学生心理') >= 0 || s.indexOf('思政') >= 0
     || s.indexOf('思想政治') >= 0 || s.indexOf('机器人') >= 0) return 'cc-pink';
  return '';
}
function courseName(title){
  var s = String(title || '');
  if(s.indexOf('Python') >= 0) return 'Python';
  s = s.replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '').trim();
  return s || String(title || '');
}
function bucketOf(t, nowMs){
  // 待排：没有落位就一直挂着，不自动进今天，也不会因为日子过去变逾期
  if(t.todo && !(t._slot && t._slot.start)) return 'todo';
  var deadline = t.deadline ? Date.parse(t.deadline) : null;
  if(deadline && deadline < nowMs) return 'overdue';

  var anchor = null;
  if(t.deadline) anchor = dayOfIso(t.deadline);
  else if(t._slot && t._slot.start) anchor = dayOfIso(t._slot.start);
  else if(t.window && t.window.start) anchor = dayOfIso(t.window.start);

  if(t.big) return (anchor && anchor <= TODAY) ? 'today' : 'countdown';

  if(anchor){
    var diff = daysBetween(anchor, TODAY);
    if(diff <= 0) return 'today';
    if(diff === 1) return 'tomorrow';
    if(diff === 2) return 'dayAfter';
    if(diff <= 7) return 'week';
    return 'backlog';
  }
  if(t.window && t.window.start && t.window.end){
    var ws = dayOfIso(t.window.start), we = dayOfIso(t.window.end);
    if(ws <= TODAY && TODAY <= we) return 'today';
    if(ws <= addDays(TODAY,1) && addDays(TODAY,1) <= we) return 'tomorrow';
    if(ws <= addDays(TODAY,2) && addDays(TODAY,2) <= we) return 'dayAfter';
    if(we <= addDays(TODAY,7)) return 'week';
  }
  return 'backlog';
}
function dayLabel(key){
  var diff = daysBetween(key, TODAY);
  if(diff === 0) return '今天';
  if(diff === 1) return '明天';
  if(diff === 2) return '后天';
  if(diff === -1) return '昨天';
  if(diff === -2) return '前天';
  return md(key)+' 周'+WD[weekdayOf(key)];
}
function shortTitle(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) : s; }
function catName(c){ return c === 'study' ? '学' : c === 'play' ? '玩' : c === 'life' ? '生活' : '事项'; }
function catClass(c){ return 'cat-' + (c === 'study' || c === 'play' || c === 'life' ? c : 'other'); }
function hm2min(v){ var p = String(v).split(':'); return parseInt(p[0],10)*60 + parseInt(p[1],10); }

/* ---------------- 视口适配：页面卡死在单屏内 ---------------- */
function fitViewport(){
  var h = 0;
  if(window.visualViewport && window.visualViewport.height) h = window.visualViewport.height;
  else if(window.innerHeight) h = window.innerHeight;
  var de = document.documentElement;
  if(h > 0 && de && de.style && de.style.setProperty){
    de.style.setProperty('--app-h', h + 'px');
  }
}
function fitBoard(){
  var r = board.getBoundingClientRect ? board.getBoundingClientRect() : null;
  var height = r ? r.height : 0;
  if(!height || height < 160){
    height = ((window.innerHeight || 780) - 150);
  }
  // 13 个小时刻度必须一屏放下，所以每小时高度由剩余空间算出来
  var avail = height - HEAD - STRIP - LATEH;
  var per = avail / (DEND - DSTART);
  HOUR = Math.max(20, Math.min(110, per));
  PXMIN = HOUR / 60;
  GRIDH = (DEND - DSTART) * HOUR;
  if(board.style && board.style.setProperty){
    board.style.setProperty('--hh', HOUR + 'px');
    board.style.setProperty('--gh', GRIDH + 'px');
  }
}

/* ---------------- 存储 ---------------- */
function taskDayOf(t){
  if(t.slot && t.slot.start) return dayOfIso(t.slot.start);
  if(t.window && t.window.start) return dayOfIso(t.window.start);
  return null;
}
function serverHasSame(op){
  var list = B.tasks || [];
  var title = String(op.title || '').trim();
  for(var i = 0; i < list.length; i++){
    if(String(list[i].title || '').trim() !== title) continue;
    if(taskDayOf(list[i]) === op.day) return true;
  }
  return false;
}
function opIsAlive(o){
  if(!o || !o.code || !o.kind) return false;
  if(!o.sentAt) return true;                       // 没发送的永远留着
  // 服务端已经有同标题同一天的任务 = 这条新建其实已经生效了，
  // 别再拿本地草稿在任务栏里重影一份（旧同步号没记进 applied 时的兜底）
  if(o.kind === 'N' && serverHasSame(o)) return false;
  var applied = B.applied || [];
  // 复制过 ≠ 送达过：只有服务端真的执行过这批号，才允许清掉
  var ids = o.syncIds || (o.syncId ? [o.syncId] : []);
  if(ids.length){
    for(var i = 0; i < ids.length; i++){
      if(applied.indexOf(ids[i]) >= 0) return false;
    }
    return true;
  }
  if(o.board && B.boardId && o.board !== B.boardId) return false;  // 老数据兜底
  return !(o.sentAt <= Date.parse(B.generatedAt)); // 老规则兜底
}
function dedupeOps(list){
  var byCode = {};
  list.forEach(function(o){
    if(!o || !o.code) return;
    (byCode[o.code] = byCode[o.code] || []).push(o);
  });
  var out = [];
  Object.keys(byCode).forEach(function(code){
    var arr = byCode[code].sort(function(a, b){ return (a.at || 0) - (b.at || 0); });
    var lastNew = null, lastDone = null, lastLen = null;
    var lastPlace = null, lastTodo = null, lastDrop = null;
    arr.forEach(function(o){
      if(o.kind === 'N') lastNew = o;
      else if(o.kind === 'D' || o.kind === 'U') lastDone = o;
      else if(o.kind === 'L') lastLen = o;
      else if(o.kind === 'P') lastPlace = o;
      else if(o.kind === 'S') lastTodo = o;
      else if(o.kind === 'X') lastDrop = o;
    });
    if(lastNew) out.push(lastNew);          // 草稿的新建指令必须保留
    if(lastDrop){ out.push(lastDrop); return; }
    if(lastDone){
      out.push(lastDone);
      if(lastDone.kind === 'U'){            // 取消完成后可能又调时长/落位
        if(lastLen) out.push(lastLen);
        if(lastPlace) out.push(lastPlace);
      }
      return;
    }
    if(lastLen) out.push(lastLen);
    var slotOp = null;
    if(lastPlace && lastTodo) slotOp = (lastPlace.at >= lastTodo.at) ? lastPlace : lastTodo;
    else slotOp = lastPlace || lastTodo;
    if(slotOp) out.push(slotOp);
  });
  return out.sort(function(a, b){ return (a.at || 0) - (b.at || 0); });
}
function loadOps(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return [];
    var arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return [];
    return arr.filter(opIsAlive);
  }catch(e){ appState.storageOk = false; return []; }
}
function saveOps(){
  try{
    // 多个标签页共用一份存储：写之前先合并，别让新标签把旧标签刚点的操作盖掉
    var raw = localStorage.getItem(KEY);
    var stored = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(stored)) stored = [];
    stored = stored.filter(function(o){ return o && o.id && opIsAlive(o); });
    var byId = {};
    stored.forEach(function(o){ byId[o.id] = o; });
    appState.ops.forEach(function(o){ if(o.id) byId[o.id] = o; });
    appState.ops = dedupeOps(Object.keys(byId).map(function(k){ return byId[k]; })
      .sort(function(a, b){ return (a.at || 0) - (b.at || 0); }));
    localStorage.setItem(KEY, JSON.stringify(appState.ops));
    appState.storageOk = true;
  }catch(e){ appState.storageOk = false; }
}

/* ---------------- 数据模型 ---------------- */
function draftTask(op){
  var slot = null;
  if(op.time){
    var start = op.day + 'T' + op.time + ':00+08:00';
    slot = {start: start, end: shift(start, op.minutes || 30)};
  }
  return {
    taskId: 'draft_' + op.code,
    code: op.code,
    title: op.title || '未命名',
    deadline: null,
    slot: slot,
    window: {
      start: op.day + 'T04:00:00+08:00',
      end: op.day + 'T23:59:00+08:00',
    },
    weight: 1,
    estMin: op.minutes || 30,
    loc: op.loc || null,
    tags: [],
    category: op.category || 'other',
    repeat: null,
    big: false,
    block: null,
    todo: !slot,
    bucket: 'today',
    _draft: true,
    createdAt: new Date(op.at || Date.now()).toISOString(),
    _done: false,
    _slot: slot,
    _touched: true,
  };
}

function viewTasks(){
  var list = (B.tasks || []).map(function(t){
    var c = {}; for(var k in t) c[k] = t[k];
    c._done = false; c._slot = t.slot || null; c._touched = false;
    return c;
  });
  appState.ops.forEach(function(op){
    if(op.kind === 'N') list.push(draftTask(op));
  });
  var by = {}; list.forEach(function(t){ by[t.code] = t; });
  appState.ops.forEach(function(op){
    if(op.kind === 'N') return;
    var t = by[op.code]; if(!t) return;
    t._touched = true;
    if(op.kind === 'D') t._done = true;
    else if(op.kind === 'U') t._done = false;
    else if(op.kind === 'L'){
      t.estMin = op.minutes;
      if(t._slot){ t._slot = {start:t._slot.start, end:shift(t._slot.start, op.minutes)}; }
    } else if(op.kind === 'P'){
      t._slot = {start:op.start, end:shift(op.start, op.minutes)};
      t.block = (t.category === 'study' || t.category === 'play') ? t.category : null;
    } else if(op.kind === 'S'){
      t._slot = null;
      t.block = null;
    } else if(op.kind === 'X'){
      t._dropped = true;
    }
  });
  var sync = {};
  appState.ops.forEach(function(op){
    if(!op.code) return;
    var st = sync[op.code] || (sync[op.code] = {unsent:false, sent:false});
    if(op.sentAt) st.sent = true;
    else st.unsent = true;
  });
  list.forEach(function(t){
    var st = sync[t.code];
    t._unsent = !!(st && st.unsent);
    t._waiting = !!(st && st.sent && !st.unsent);
  });
  return list;
}
function findAll(code){
  var list = viewTasks();
  for(var i=0;i<list.length;i++){ if(list[i].code === code) return list[i]; }
  return null;
}
function findPending(code){
  var list = viewTasks();
  for(var i=0;i<list.length;i++){ if(list[i].code === code && !list[i]._done) return list[i]; }
  return null;
}
function addOp(op){
  op.id = Math.random().toString(16).slice(2,8);
  op.at = Date.now();
  op.sentAt = 0;
  op.board = B.boardId;
  // 同一任务、同一属性只留最后一条：整点/课间反复点不会堆一长串 L/P
  appState.ops.push(op);
  appState.ops = dedupeOps(appState.ops);
  appState.pulse = op.code;
  saveOps();
  render();
}

/* ---------------- 布局计算 ---------------- */
function blocksOf(day){
  var wd = ((weekdayOf(day)+6)%7)+1;
  return (B.blocks||[]).filter(function(b){
    return (b.weekdays||[]).indexOf(wd) >= 0;
  }).map(function(b){
    return {start:hm2min(b.start), end:hm2min(b.end), kind:b.kind, label:b.label};
  });
}
function dayTasks(list, day){
  return list.filter(function(t){
    if(t.todo && !(t._slot && t._slot.start)) return false;   // 待排不进日历列
    if(t._slot && t._slot.start) return dayOfIso(t._slot.start) === day;
    if(t.deadline) return dayOfIso(t.deadline) === day;
    if(t.window && t.window.start) return dayOfIso(t.window.start) <= day && day <= dayOfIso(t.window.end);
    return false;
  });
}

/* ---------------- 渲染 ---------------- */
function render(){
  fitViewport();
  fitBoard();
  var st = board.scrollTop;
  var all = viewTasks();
  var pending = all.filter(function(t){ return !t._done && !t._dropped; });
  var done = all.filter(function(t){ return t._done && !t._dropped; });
  var nowMs = Date.now();
  pending.forEach(function(t){ t.bucket = bucketOf(t, nowMs); });

  hdt.textContent = md(appState.anchor)+' 周'+WD[weekdayOf(appState.anchor)]+' · '+pending.length+' 项';
  wk.textContent = weekLabel(appState.anchor);
  if(boardver) boardver.textContent = '板 '+B.boardId+' · '+hhmmIso(B.generatedAt);

  board.innerHTML = railHtml() + columnHtml(addDays(appState.anchor,0), 0, pending)
    + columnHtml(addDays(appState.anchor,1), 1, pending)
    + columnHtml(addDays(appState.anchor,2), 2, pending);
  board.scrollTop = st;

  renderDrawer(pending, done);
  if(appState.pulse){
    var pn = document.querySelectorAll('[data-code="'+appState.pulse+'"]');
    for(var pi = 0; pi < pn.length; pi++){ pn[pi].classList.add('just'); }
    appState.pulse = null;
  }
  renderMini(pending);
  renderDock(pending);
  renderBigbar(pending);
  renderSel();
  warnb.hidden = appState.storageOk;
  if(!appState.storageOk){
    warnb.textContent = '本机没保存住改动（浏览器禁用了本地存储）：离开本页前请先复制同步码，否则这些点击会丢。';
  }
  positionNow();
}

function hhmmH(v){ var m = Math.round(v*60); return pad(Math.floor(m/60))+':'+pad(m%60); }
function railHtml(){
  var out = '<div class="rail"><div class="rail-head"></div><div class="rail-pad"></div>';
  out += '<div class="rail-body" style="height:'+GRIDH+'px">';
  HOURS.forEach(function(h){
    out += '<span class="rl" style="top:'+((h-DSTART)*HOUR-5)+'px">'+h+':00</span>';
  });
  out += '<span class="rl" style="top:'+(GRIDH-7)+'px">'+hhmmH(DEND)+'</span>';
  out += '<span class="nowdot" data-now style="display:none"></span></div></div>';
  return out;
}

function columnHtml(day, idx, pending){
  var items = dayTasks(pending, day);
  var timed = [], loose = [];
  items.forEach(function(t){
    if(t._slot && t._slot.start && dayOfIso(t._slot.start) === day) timed.push(t);
    else loose.push(t);
  });

  var gh = '';
  blocksOf(day).forEach(function(b){
    var a = Math.max(b.start, DSTART*60), z = Math.min(b.end, DEND*60);
    if(z <= a) return;
    gh += '<div class="blk '+b.kind+'" style="top:'+((a-DSTART*60)*PXMIN)+'px;height:'
      + ((z-a)*PXMIN)+'px"><i>'+esc(b.label || (b.kind === 'study' ? '学' : '玩'))+'</i></div>';
  });

  var late = [];
  var lateCourses = [];
  coursesOf(day).forEach(function(c){
    var a = hm2min(c.start), z = hm2min(c.end);
    if(a >= DEND*60){ lateCourses.push(c); return; }
    var top = Math.max(0, (a - DSTART*60) * PXMIN);
    var bottom = Math.min(DEND*60, Math.max(z, a + 15));
    var ch = Math.max(18, (bottom - Math.max(a, DSTART*60)) * PXMIN);
    gh += '<div class="course '+courseClass(c.title)+'" data-act="course"'
      + ' data-title="'+esc(c.title)+'" data-loc="'+esc(c.loc || '')+'"'
      + ' data-wd="'+c.weekday+'" data-st="'+c.start+'" data-en="'+c.end+'"'
      + ' style="top:'+top+'px;height:'+ch+'px"'
      + ' title="'+esc(c.title+' '+c.start+'-'+c.end+(c.loc ? ' '+c.loc : ''))+'">'
      + '<span class="ct"><i>课</i>'+esc(courseName(c.title))+'</span>'
      + '<em>'+esc(c.loc || '')+'</em></div>';
    if(z > DEND*60) lateCourses.push(c);
  });

  timed.forEach(function(t){
    var a = minOfIso(t._slot.start);
    var z = t._slot.end ? minOfIso(t._slot.end) : a + (t.estMin || 30);
    if(a >= DEND*60){ late.push(t); return; }
    var top = Math.max(0, (a - DSTART*60) * PXMIN);
    var bottom = Math.min(DEND*60, Math.max(z, a + 15));
    var tall = Math.max(20, (bottom - Math.max(a, DSTART*60)) * PXMIN);
    var ctl = tall >= 34
      ? '<span class="evctl"><button data-act="minus" data-code="'+t.code+'">−</button>'
        + '<button data-act="plus" data-code="'+t.code+'">+</button></span>'
      : '';
    var inClass = coursesOf(day).some(function(c){
      return hm2min(c.start) < z && hm2min(c.end) > a;
    });
    gh += '<div class="ev '+catClass(t.category)+(t._touched?' touched':'')
      + (inClass ? ' in-class' : '')
      + '" data-act="focus" data-code="'+t.code+'" style="top:'+top+'px;height:'+tall+'px"'
      + ' title="'+esc(t.title)+'"><span class="evt">'+esc(t.title)+'</span>'
      + '<b>'+hhmmIso(t._slot.start)+'</b>'+ctl+'</div>';
    if(z > DEND*60) late.push(t);
  });

  var todayLive = dayOfMs(Date.now());
  if(day === todayLive){
    gh += '<div class="now" data-now style="display:none"><span class="nowlab"></span></div>';
  }

  var lateBits = [];
  late.forEach(function(t){
    lateBits.push('<span class="lt '+catClass(t.category)+'" data-act="focus" data-code="'+t.code+'">'
      + esc(shortTitle(t.title,5))+' '+hhmmIso(t._slot.start)+'</span>');
  });
  lateCourses.forEach(function(c){
    lateBits.push('<span class="lt course" data-act="course" data-title="'+esc(c.title)+'"'
      + ' data-loc="'+esc(c.loc || '')+'" data-wd="'+c.weekday+'"'
      + ' data-st="'+c.start+'" data-en="'+c.end+'">'
      + esc(shortTitle(courseName(c.title),6))+' '+c.start+'</span>');
  });
  var lateHtml = lateBits.length ? lateBits.join('')
    : '<span class="lt-empty">'+esc(hhmmH(DEND))+' 之后 · 空</span>';

  var full = freeMinutes(day) < 120;
  var stat = '<span class="stripstat'+(full?' full':'')+'">'+(full?'排满':'待排')+'</span>';
  var strip = stat + loose.map(function(t){
    return '<span class="chip '+catClass(t.category)+'" data-act="focus" data-code="'+t.code+'"'
      + ' title="'+esc(t.title)+'">'+esc(shortTitle(t.title,6))+'</span>';
  }).join('');

  var expanded = board.dataset.expand === ('d'+idx);
  var head = '<div class="dhead" data-act="expand" data-day="'+idx+'">'
    + '<span class="dl">'+dayLabel(day)+'</span>'
    + '<span class="dd">'+md(day)+' 周'+WD[weekdayOf(day)]+(items.length?' · '+items.length:'')
    + '</span><span class="dexp">'+(expanded?'⇤':'⤢')+'</span></div>';

  return '<section class="col'+(expanded?' wide':'')+'" data-day="'+idx+'">'+head
    + '<div class="strip">'+strip+'</div>'
    + '<div class="grid'+(appState.sel?' placing':'')+'" data-day="'+day+'" data-idx="'+idx+'">'
    + gh+'</div>'
    + '<div class="late">'+lateHtml+'</div></section>';
}

function cardHtml(t){
  var chips = '<i class="tag '+t.category+'">'+catName(t.category)+'</i>';
  if(t.big) chips += '<i class="tag big">大事</i>';
  if(t.repeat) chips += '<i class="tag">🔁</i>';
  if(t.deadline) chips += '<i class="tag">'+dayLabel(dayOfIso(t.deadline))+' ';
  if(t.deadline) chips += hhmmIso(t.deadline)+'</i>';
  if(t._slot) chips += '<i class="tag">'+dayLabel(dayOfIso(t._slot.start))+' ';
  if(t._slot) chips += hhmmIso(t._slot.start)+'</i>';
  if(t.loc) chips += '<i class="tag">'+esc(t.loc)+'</i>';
  if(t._draft) chips += '<i class="tag new">新任务</i>';
  if(t._unsent) chips += '<i class="tag new">待复制</i>';
  else if(t._waiting) chips += '<i class="tag wait">待确认</i>';

  return '<div class="card '+catClass(t.category)+(t._done?' done':'')
    + (appState.sel === t.code ? ' selected' : '')+'" data-code="'+t.code+'">'
    + '<button class="cb'+(t._done?' on':'')+'" data-act="check" data-code="'+t.code+'"'
    + ' aria-label="完成"></button>'
    + '<div class="cmain"><div class="ct" data-act="focus" data-code="'+t.code+'"'
    + ' role="button">'+esc(t.title)+'</div><div class="cm">'+chips
    + '<span class="lenbox">'
    + '<button data-act="minus" data-code="'+t.code+'" aria-label="减时长">−</button>'
    + '<span class="len">'+t.estMin+'分</span>'
    + '<button data-act="plus" data-code="'+t.code+'" aria-label="加时长">+</button>'
    + '</span>'
    + '<button class="placebtn" data-act="place" data-code="'+t.code+'">⌖ 落位</button>'
    + '</div></div></div>';
}

function decisionList(pending, nowMs){
  var out = [];
  pending.forEach(function(t){
    if(t._draft || t._done) return;
    if(t.todo) return;                        // 待排是用户主动放着的，别再弹“待安排”
    if(t.deadline) return;                    // 硬截止的事不在这里重排
    if(t._slot && t._slot.end && Date.parse(t._slot.end) < nowMs) out.push(t);
    else if(!t._slot && t.window && t.window.end && Date.parse(t.window.end) < nowMs) out.push(t);
  });
  return out;
}
function nowMin(){
  var w = wall(Date.now());
  return w.getUTCHours()*60 + w.getUTCMinutes();
}
function hm(min){ return pad(Math.floor(min/60))+':'+pad(min%60); }
function nextFreeSlot(t){
  var dur = Math.max(10, t.estMin || 30);
  for(var i=0;i<8;i++){
    var day = addDays(TODAY, i);
    var desired = i === 0 ? Math.max(nowMin(), DSTART*60) : DSTART*60;
    var s = chooseStart(day, desired, dur, t.code);
    if(s != null) return {day: day, start: s};
  }
  return null;
}

/* ---------------- 红线 ---------------- */
function positionNow(){
  var liveDay = dayOfMs(Date.now());
  if(liveDay !== TODAY){
    var wasToday = appState.anchor === TODAY;
    TODAY = liveDay;
    if(wasToday) appState.anchor = TODAY;
    render();
    return;
  }
  var m = wall(Date.now());
  var minutes = m.getUTCHours()*60 + m.getUTCMinutes();
  var lo = DSTART*60, hi = DEND*60;
  // 超出时间轴：线钉在顶/底边，时间轴右端那一小段红线也一起保留
  var shown = Math.max(lo, Math.min(hi, minutes));
  var y = Math.min((shown - lo) * PXMIN, (hi - lo) * PXMIN - 2);
  var nodes = document.querySelectorAll('[data-now]');
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i];
    el.style.display = '';
    el.style.top = y+'px';
    if(el.classList && el.classList.toggle){
      el.classList.toggle('pin-top', minutes < lo);
      el.classList.toggle('pin-bottom', minutes > hi);
    }
    var lab = el.querySelector('.nowlab');
    if(lab) lab.textContent = pad(Math.floor(shown/60))+':'+pad(shown%60);
  }
}

function pickTempCode(){

  (B.tasks || []).forEach(function(t){ used[t.code] = 1; });
  appState.ops.forEach(function(o){ if(o.kind === 'N') used[o.code] = 1; });
  for(var i=1;i<=99;i++){
    var code = 'nn' + (i < 10 ? '0' : '') + i;
    if(!used[code]) return code;
  }
  return 'nn' + Math.floor(Math.random() * 90 + 10);

function formWarning(){
  if(!formState || !formState.time) return '';
  var day = formState.day, m = hm2min(formState.time), dur = formState.minutes;
  if(day === TODAY && m < nowMin()) return '这个时间已经过去了';
  if(m + dur > DEND*60) return formState.time+' 加 '+dur+' 分钟会超过 '+hm(DEND*60);
  var busy = busyIntervals(day, null);
  if(overlapsBusy(m, m + dur, busy)){
    var free = chooseStart(day, m, dur, null);
    return formState.time+' 已经有课或任务' + (free != null ? '，最近空档 '+hm(free) : '');
  }
  return '';

/* ---------------- 复制 ---------------- */
function rand4(){
  var a = '0123456789abcdef', s = '';
  for(var i=0;i<4;i++) s += a[Math.floor(Math.random()*16)];
  return s;
}
function pendingOps(){
  var applied = B.applied || [];
  return appState.ops.filter(function(o){
    if(!o.sentAt) return false;
    var ids = o.syncIds || (o.syncId ? [o.syncId] : []);
    for(var i = 0; i < ids.length; i++){
      if(applied.indexOf(ids[i]) >= 0) return false;
    }
    return true;
  });
}
function codeFor(list){
  var lines = ['JY'+(B.boardId||'0000')+'-'+rand4()];
  // 新建必须排在前面，同批的勾选/落位才有任务可指
  list.filter(function(o){ return o.kind === 'N'; }).forEach(function(o){
    lines.push('N '+o.code+' '+o.day+' '+(o.time || '-')+' '+(o.minutes || 30)
      +' '+(o.category || 'other')+' '+String(o.title || '').replace(/\s+/g, ' ')
      +'|'+String(o.loc || ''));
  });
  list.filter(function(o){ return o.kind !== 'N'; }).forEach(function(o){
    var title = String(o.title || '').replace(/\s+/g, ' ');
    if(o.kind === 'D' || o.kind === 'U') lines.push(o.kind+' '+o.code+' '+title);
    else if(o.kind === 'L') lines.push('L '+o.code+' '+o.minutes+' '+title);
    else if(o.kind === 'P') lines.push('P '+o.code+' '+o.start.slice(0,16)+' '+o.minutes+' '+title);
    else if(o.kind === 'S') lines.push('S '+o.code);
    else if(o.kind === 'X') lines.push('X '+o.code);
  });
  appState.lastSyncId = lines[0].replace(/^JY[^-]*-?/, '');
  return lines.join('\n');
}
function buildCode(){
  return codeFor(appState.ops.filter(function(o){ return !o.sentAt; }));
}
function markSent(list, sid){
  var now = Date.now();
  list.forEach(function(o){
    o.sentAt = now;
    if(!sid) return;
    var ids = o.syncIds || (o.syncId ? [o.syncId] : []);
    if(ids.indexOf(sid) < 0) ids.push(sid);
    o.syncIds = ids;
    o.syncId = sid;
  });
  saveOps();
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copyText(text){
  return new Promise(function(resolve){
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(
        function(){ resolve(true); },
        function(){ resolve(fallbackCopy(text)); }
      );
      return;
    }
    resolve(fallbackCopy(text));
  });
}
function doCopy(){
  var unsent = appState.ops.filter(function(o){ return !o.sentAt; });
  if(!unsent.length){ toast('没有新改动，按钮是灰的'); return; }
  var code = buildCode();
  appState.lastCode = code;
  try{ localStorage.setItem('jy.lastcode', code); }catch(e){}
  copyText(code).then(function(ok){
    markSent(unsent, appState.lastSyncId);
    render();
    showCode(code, ok);
  });
}
function recopyPending(){
  var list = pendingOps();
  if(!list.length){ toast('没有待确认的改动'); return; }
  var code = codeFor(list);
  appState.lastCode = code;
  try{ localStorage.setItem('jy.lastcode', code); }catch(e){}
  copyText(code).then(function(ok){
    markSent(list, appState.lastSyncId);
    render();
    showCode(code, ok);
  });
}

function adjust(code, delta){

  var next = Math.max(10, Math.min(480, (t.estMin || 30) + delta));
  if(next === t.estMin){ toast('已经到上下限了'); return; }
  addOp({kind:'L', code:t.code, title:t.title, minutes:next});

  if(!t){ toast('这条已经完成了'); return; }

  closeModal();

function busyIntervals(day, excludeCode){
  var out = [];
  coursesOf(day).forEach(function(c){ out.push([hm2min(c.start), hm2min(c.end)]); });
  viewTasks().forEach(function(t){
    if(t._done || t.code === excludeCode) return;
    if(t._slot && t._slot.start && dayOfIso(t._slot.start) === day){
      var a = minOfIso(t._slot.start);
      var z = t._slot.end ? minOfIso(t._slot.end) : a + (t.estMin || 30);
      out.push([a, z]);
    }
  });
  out.sort(function(x, y){ return x[0] - y[0]; });
  return out;
}
function overlapsBusy(s, e, busy){
  for(var i = 0; i < busy.length; i++){
    if(busy[i][0] < e && busy[i][1] > s) return true;
  }
  return false;
}
function freeGaps(day, excludeCode){
  var lo = DSTART*60, hi = DEND*60, gaps = [], cur = lo;
  busyIntervals(day, excludeCode).forEach(function(b){
    var s = Math.max(b[0], lo), e = Math.min(b[1], hi);
    if(e <= cur) return;
    if(s > cur) gaps.push([cur, s]);
    cur = Math.max(cur, e);
  });
  if(cur < hi) gaps.push([cur, hi]);
  return gaps;
}
function freeMinutes(day){
  var total = 0;
  freeGaps(day, null).forEach(function(g){ total += Math.max(0, g[1] - g[0]); });
  return total;
}
function chooseStart(day, desired, dur, excludeCode){
  var lo = DSTART*60, hi = DEND*60;
  desired = Math.round(desired/30) * 30;
  desired = Math.max(lo, Math.min(hi - Math.min(dur, hi - lo), desired));
  var busy = busyIntervals(day, excludeCode);
  if(!overlapsBusy(desired, desired + dur, busy) && desired + dur <= hi) return desired;

  var best = null, bestD = Infinity;
  freeGaps(day, excludeCode).forEach(function(g){
    if(g[1] - g[0] < dur) return;
    [g[0], g[1] - dur].forEach(function(c){
      c = Math.round(c/5) * 5;               // 课间缝隙按 5 分钟对齐
      if(c < lo || c + dur > hi) return;
      if(overlapsBusy(c, c + dur, busy)) return;
      var d = Math.abs(c - desired);
      if(d < bestD){ bestD = d; best = c; }
    });
  });
  return best;
}
function courseContaining(day, start, dur){
  var list = coursesOf(day);
  for(var i=0;i<list.length;i++){
    var a = hm2min(list[i].start), z = hm2min(list[i].end);
    if(a <= start && start + dur <= z) return list[i];
  }
  return null;
}
function commitPlace(day, start, dur, t){
  appState.sel = null;
  addOp({kind:'P', code:t.code, title:t.title, start:isoAt(day, start), minutes:dur});
  toast('已排到 '+md(day)+' '+hm(start));
}
function showPlacePrompt(t, day, start, dur, freeStart, course){
  appState.placePrompt = {code:t.code, day:day, start:start, dur:dur, freeStart:freeStart};
  var html = '<div class="handle"></div><div class="body">'
    + '<h2>这个时间有安排</h2>'
    + '<div class="meta">'+dayLabel(day)+' '+hm(start)+'–'+hm(start+dur)
    + (course ? ' 与「'+esc(course.title)+'」重叠' : ' 与其他任务重叠')+'</div>'
    + '<div class="rows">'
    + '<div class="row"><i>任务</i><b>'+esc(t.title)+'</b></div>'
    + '<div class="row"><i>时长</i><b>'+dur+' 分钟</b></div>'
    + '</div></div><div class="acts">';
  if(freeStart != null){
    html += '<button class="primary" data-act="place-free" data-start="'+freeStart+'">空档 '+hm(freeStart)+'</button>';
  }
  if(course){
    html += '<button data-act="place-class">课上完成</button>';
  }
  html += '<button data-act="close">取消</button></div>';
  sheet.className = 'sheet prompt';
  sheet.innerHTML = html;
  modal.hidden = false;
}
function placeAt(grid, clientY){
  if(!appState.sel) return;
  var t = findPending(appState.sel);
  if(!t){ appState.sel = null; render(); return; }
  var r = grid.getBoundingClientRect();
  var day = grid.dataset.day;
  var dur = Math.max(10, t.estMin || 30);
  var desired = Math.round(((clientY - r.top) / PXMIN + DSTART*60) / 30) * 30;
  desired = Math.max(DSTART*60, Math.min(DEND*60 - dur, desired));

  var busy = busyIntervals(day, t.code);
  if(!overlapsBusy(desired, desired + dur, busy) && desired + dur <= DEND*60){
    commitPlace(day, desired, dur, t);
    return;
  }
  var freeStart = chooseStart(day, desired, dur, t.code);
  var course = courseContaining(day, desired, dur);
  if(freeStart == null && !course){
    toast('这个时段放不下，也没有可用空档');
    return;
  }
  showPlacePrompt(t, day, desired, dur, freeStart, course);
}
function focusTask(code){
  var t = findAll(code); if(!t){ toast('这条已经不在待办了'); return; }
  var day = null;
  if(t._slot && t._slot.start) day = dayOfIso(t._slot.start);
  else if(t.deadline) day = dayOfIso(t.deadline);
  else if(t.window && t.window.start) day = dayOfIso(t.window.start);
  var span = [appState.anchor, addDays(appState.anchor,1), addDays(appState.anchor,2)];
  if(day && span.indexOf(day) < 0 && Math.abs(daysBetween(day, TODAY)) < 60){
    appState.anchor = day;
    render();
  }
  var els = document.querySelectorAll('[data-code="'+code+'"]');
  for(var i=0;i<els.length;i++){
    (function(el){
      el.classList.add('flash');
      setTimeout(function(){ el.classList.remove('flash'); }, 1600);
    })(els[i]);
  }
  showModal(code);
}
function setDrawer(open){
  app.dataset.drawer = open ? 'open' : 'mini';
  var bg = document.getElementById('drawerbg');
  if(bg) bg.hidden = !open;
  if(open){
    markDecisionsSeen();
    renderDock(viewTasks().filter(function(t){ return !t._done; }));
  }
}
function toggleMode(){
  var cal = app.classList.toggle('cal');
  var btn = document.querySelector('[data-act="mode"]');
  if(btn) btn.textContent = cal ? '计划' : '日历';
  if(btn) btn.classList.toggle('on', cal);
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el){
    if(appState.sel && !e.target.closest('#board')){ appState.sel = null; render(); }
    return;
  }
  var act = el.dataset.act;
  var code = el.dataset.code;

  if(act === 'add'){ setDrawer(true); openForm(); return; }
  if(act === 'fcat'){ formState.title = readFormTitle(); formState.cat = el.dataset.v; showForm(); return; }
  if(act === 'fmin'){ formState.title = readFormTitle(); formState.minutes = parseInt(el.dataset.v,10); showForm(); return; }
  if(act === 'fday'){
    formState.title = readFormTitle();
    formState.day = addDays(TODAY, parseInt(el.dataset.v,10));
    showForm();
    return;
  }
  if(act === 'ftime'){ formState.title = readFormTitle(); formState.time = el.dataset.v; showForm(); return; }
  if(act === 'fadd'){
    formState.title = readFormTitle();
    if(!formState.time){ toast('选个时间，或点下面「放入待排」'); return; }
    var warn = formWarning();
    if(warn){ toast(warn); return; }
    createDraft(true);
    return;
  }
  if(act === 'ftodo'){ createDraft(false); return; }
  if(act === 'fclose'){ closeModal(); return; }
  if(act === 'resched'){
    var st = findAll(code); if(!st) return;
    var rday = el.dataset.day, rstart = parseInt(el.dataset.start,10);
    addOp({kind:'P', code:st.code, title:st.title, start:isoAt(rday, rstart),
           minutes:Math.max(10, st.estMin || 30)});
    toast('已顺延到 '+md(rday)+' '+hm(rstart));
    return;
  }
  if(act === 'toslot'){
    var ts = findAll(code); if(!ts) return;
    addOp({kind:'S', code:ts.code, title:ts.title});
    toast('已放回待排');
    return;
  }
  if(act === 'giveup'){
    var gv = findAll(code); if(!gv) return;
    addOp({kind:'X', code:gv.code, title:gv.title});
    toast('已放弃');
    return;
  }
  if(act === 'place-free'){
    var pf = appState.placePrompt; if(!pf) return;
    var pft = findPending(pf.code); if(!pft){ closeModal(); return; }
    var pfs = parseInt(el.dataset.start,10);
    var pfday = pf.day, pfdur = pf.dur;
    closeModal();
    commitPlace(pfday, pfs, pfdur, pft);
    return;
  }
  if(act === 'place-class'){
    var pc = appState.placePrompt; if(!pc) return;
    var pct = findPending(pc.code); if(!pct){ closeModal(); return; }
    var pcday = pc.day, pcstart = pc.start, pcdur = pc.dur;
    closeModal();
    commitPlace(pcday, pcstart, pcdur, pct);
    toast('已放进课上时段');
    return;
  }

  if(act === 'expand'){ 
    var d = el.dataset.day;
    board.dataset.expand = (board.dataset.expand === 'd'+d) ? 'none' : 'd'+d;
    render();
    return;
  }
  if(act === 'drawer'){ setDrawer(app.dataset.drawer !== 'open'); return; }
  if(act === 'copy'){ doCopy(); return; }
  if(act === 'recopy'){ recopyPending(); return; }
  if(act === 'forgetpending'){
    var applied = B.applied || [];
    var before = appState.ops.length;
    appState.ops = appState.ops.filter(function(o){
      if(!o.sentAt) return true;
      var ids = o.syncIds || (o.syncId ? [o.syncId] : []);
      for(var i = 0; i < ids.length; i++){ if(applied.indexOf(ids[i]) >= 0) return true; }
      return false;
    });
    saveOps();
    render();
    toast('已清掉 '+(before - appState.ops.length)+' 项待确认');
    return;
  }
  if(act === 'check'){ toggleDone(code); return; }
  if(act === 'minus'){ adjust(code, -15); return; }
  if(act === 'plus'){ adjust(code, 15); return; }
  if(act === 'place'){ startPlace(code); return; }
  if(act === 'focus'){ focusTask(code); return; }
  if(act === 'course'){
    if(appState.sel){
      var g = e.target.closest('.grid');
      if(g){ placeAt(g, e.clientY); return; }
    }
    showCourse(el.dataset);
    return;
  }
  if(act === 'day'){
    appState.anchor = addDays(appState.anchor, parseInt(el.dataset.d, 10));
    render();
    return;
  }
  if(act === 'today'){ appState.anchor = TODAY; render(); return; }
  if(act === 'wk'){ appState.anchor = addDays(appState.anchor, parseInt(el.dataset.d,10)); render(); return; }
  if(act === 'mode'){ toggleMode(); return; }
  if(act === 'cancelsel'){ appState.sel = null; render(); return; }
  if(act === 'close'){ closeModal(); return; }
  if(act === 'mcheck'){ toggleDone(code); return; }
  if(act === 'mminus'){ adjust(code, -15); return; }
  if(act === 'mplus'){ adjust(code, 15); return; }
  if(act === 'mplace'){ startPlace(code); return; }
  if(act === 'copyagain'){
    var box = document.getElementById('codebox');
    if(box){ copyText(box.value).then(function(ok){ toast(ok ? '已复制' : '复制失败，长按全选'); }); }
    return;
  }
});

board.addEventListener('click', function(e){
  if(!appState.sel) return;
  if(e.target.closest('[data-act]')) return;
  var grid = e.target.closest('.grid');
  if(!grid) return;
  placeAt(grid, e.clientY);
});

modal.addEventListener('click', function(e){
  if(e.target === modal){ closeModal(); }
});

/* ---------------- 启动 ---------------- */
window.__jyApply = function(next){
  if(!next || !next.boardId) return;
  var stickToday = (appState.anchor === TODAY);
  var keepAnchor = appState.anchor;
  TODAY = dayOfMs(Date.now());
  B = next;
  window.BOARD = next;
  WEEKLY = copyList(next.courses);
  OVERRIDES = next.overrides || {};
  TERM_START = next.termStart || next.today;
  TERM_WEEK = next.termWeek || 1;
  appState.ops = loadOps();
  appState.anchor = stickToday ? TODAY : keepAnchor;
  saveOps();
  render();
  try{ toast('已换到最新 · ' + hhmmIso(next.generatedAt)); }catch(e){}
};

TODAY = dayOfMs(Date.now());
appState.anchor = TODAY;
try{ appState.lastCode = localStorage.getItem('jy.lastcode') || ''; }catch(e){}
appState.ops = loadOps();
saveOps();
fitViewport();
render();
setDrawer(app.dataset.drawer === 'open');
setInterval(positionNow, 30000);
window.addEventListener('beforeunload', function(e){
  if(appState.ops.some(function(o){ return !o.sentAt; })){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

var resizeTimer = null;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    fitViewport();
    render();
  }, 120);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if(window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', onResize);
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden){ fitViewport(); positionNow(); }
});
};
</script>
<script>
(function(){
  var http = /^https?:$/.test((window.location && window.location.protocol) || '');
  var PAGE_URL = 'board.json';
  var rawFails = 0, rawSkipUntil = 0, booted = false;
  // GitHub Pages 的 CDN 强制缓存 10 分钟，查询串不参与缓存键，所以再加一路
  // raw.githubusercontent.com（缓存 5 分钟、经常直接回源），两路取「发布时间最新」的那份。
  function remoteUrl(){
    try{
      var host = window.location.hostname || '';
      var repo = (window.location.pathname || '/').split('/')[1] || '';
      if(host.indexOf('.github.io') < 0 || !repo) return null;
      var owner = host.split('.')[0];
      return 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/main/board.json';
    }catch(e){ return null; }
  }
  function fetchBoard(url, timeoutMs){
    if(!window.fetch) return Promise.resolve(null);
    var opts = {cache:'no-store'}, ctrl = null, timer = null;
    if(window.AbortController){
      ctrl = new window.AbortController();
      opts.signal = ctrl.signal;
      timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, timeoutMs || 4000);
    }
    return fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), opts)
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
      .then(function(d){ if(timer) clearTimeout(timer); return d || null; });
  }
  function newest(list){
    var best = null;
    for(var i = 0; i < list.length; i++){
      var d = list[i];
      if(!d || !d.boardId) continue;
      if(!best || String(d.generatedAt || '') > String(best.generatedAt || '')) best = d;
    }
    return best;
  }
  function boot(){
    if(booted) return;
    booted = true;
    try{ if(window.__jyBoot) window.__jyBoot(); }
    catch(e){
      if(window.console) console.error(e);
      var b = document.getElementById('board');
      if(b) b.innerHTML = '<div style="padding:24px;color:#c66;font-size:13px;line-height:1.6">'
        + '看板渲染出错：' + (e && e.message ? e.message : e)
        + '<br>下拉刷新一次试试；还不行就把这句发给我。</div>';
    }
  }
  if(http && window.fetch){
    function refresh(){
      if(document.hidden) return;
      var jobs = [fetchBoard(PAGE_URL, 4500)];
      var remote = remoteUrl();
      if(remote && Date.now() > rawSkipUntil){
        jobs.push(fetchBoard(remote, 5000).then(function(d){
          if(d){ rawFails = 0; }
          else {
            rawFails++;
            if(rawFails >= 2) rawSkipUntil = Date.now() + 600000;  // 连不上就先歇 10 分钟
          }
          return d;
        }));
      }
      Promise.all(jobs).then(function(list){
        var d = newest(list);
        if(!d) return;
        var cur = window.BOARD || {};
        if(d.boardId === cur.boardId) return;
        // 只认比手上更新的那份，避免另一路缓存旧版把新数据盖回去
        if(String(d.generatedAt || '') <= String(cur.generatedAt || '')) return;
        if(window.__jyApply) window.__jyApply(d);
      }).catch(function(){});
    }
    /* 先用 HTML 里内嵌的那份把界面画出来：网络慢、raw 被墙也不会白屏 */
    boot();
    refresh();
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh(); });
    window.addEventListener('pageshow', refresh);
    window.addEventListener('online', refresh);
    setInterval(refresh, 45000);
  } else { boot(); }
})();
</script>
