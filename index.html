<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行程">
<meta name="theme-color" content="#161a21">
<title>行程看板 · 2026-10-31</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1115;--panel:#161a21;--panel2:#1d222b;--ink:#e8ebf0;--dim:#8b94a3;--line:#252b36;
  --study:#4f8cff;--play:#f0a020;--life:#2dd4a7;--other:#a78bfa;--course:#8fa0c4;
  --red:#ff4d4f;--hot:#ff6b6b;--hh:46px;--head:40px;--strip:26px;
  --bar:calc(32px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme: light){
  :root{--bg:#f4f5f7;--panel:#fff;--panel2:#f0f2f5;--ink:#1a1d23;--dim:#6b7280;--line:#e2e5ea;}
}
html,body{height:100%;overflow:hidden}
body{margin:0;position:fixed;inset:0;background:var(--bg);color:var(--ink);
  font:13px/1.4 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
.app{height:var(--app-h,100vh);display:flex;flex-direction:column;position:relative;
  overflow:hidden;overscroll-behavior:none}

/* ---------- 顶栏 ---------- */
.hdr{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--line);background:var(--panel);z-index:20}
.hdr .logo{font-size:13px;font-weight:800;letter-spacing:1px}
.hdr .dt{font-size:10px;color:var(--dim);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hnav{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:1px 2px;flex:none}
.hnav button{border:0;background:none;color:var(--ink);width:20px;height:20px;
  font-size:14px;line-height:1;border-radius:50%;padding:0}
.hnav span{font-size:9px;color:var(--dim);min-width:36px;text-align:center}
.hbtn{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font-size:10px;border-radius:999px;padding:4px 8px}
.hbtn.on{background:var(--study);border-color:var(--study);color:#08111f;font-weight:700}

/* ---------- 四列日历 ---------- */
.board{flex:1;min-height:0;display:grid;grid-template-columns:26px 1.30fr .90fr .72fr;
  overflow:hidden;overscroll-behavior:none;
  transition:grid-template-columns .28s cubic-bezier(.2,.7,.2,1)}
.board[data-expand="d0"]{grid-template-columns:26px 1.78fr .78fr .62fr}
.board[data-expand="d1"]{grid-template-columns:26px 1.02fr 1.74fr .62fr}
.board[data-expand="d2"]{grid-template-columns:26px 1.02fr .62fr 1.74fr}
.rail{position:relative;border-right:1px solid var(--line)}
.rail-head{height:var(--head);position:sticky;top:0;z-index:8;background:var(--panel)}
.rail-pad{height:var(--strip);background:var(--panel);border-bottom:1px solid var(--line)}
.rail-body{position:relative;height:var(--gh,552px);background:var(--panel)}
.rl{position:absolute;left:2px;font-size:8px;color:var(--dim);transform:translateY(-5px)}
.nowdot{position:absolute;left:2px;width:7px;height:7px;border-radius:50%;
  background:var(--red);transform:translateY(-3px);z-index:9;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 25%,transparent)}
.col{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);
  position:relative}
.col:last-child{border-right:0}
.dhead{height:var(--head);position:sticky;top:0;z-index:8;background:var(--panel);
  padding:3px 4px 2px;cursor:pointer;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;user-select:none}
.dhead:active{background:var(--panel2)}
.dhead .dl{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:12px}
.dhead .dd{font-size:8px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.dhead .dexp{position:absolute;right:2px;bottom:3px;font-size:9px;color:var(--dim)}
.strip{height:var(--strip);display:flex;gap:3px;align-items:center;padding:0 2px;
  overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);
  background:var(--panel);scrollbar-width:none;flex:none}
.strip::-webkit-scrollbar{display:none}
.strip.empty{color:var(--dim);font-size:8px;justify-content:center}
.chip{flex:none;font-size:8.5px;line-height:1.6;padding:0 4px;border-radius:4px;
  border:1px solid var(--line);border-left-width:2px;color:var(--ink);
  background:var(--panel2);white-space:nowrap;max-width:78px;overflow:hidden;
  text-overflow:ellipsis}
.cat-study{border-left-color:var(--study)}
.cat-play{border-left-color:var(--play)}
.cat-life{border-left-color:var(--life)}
.cat-other{border-left-color:var(--other)}
.grid{position:relative;height:var(--gh,552px);flex:none;
  background:repeating-linear-gradient(to bottom,
    transparent 0 calc(var(--hh,46px)/2 - 1px),
    color-mix(in srgb,var(--line) 45%,transparent) calc(var(--hh,46px)/2 - 1px) calc(var(--hh,46px)/2),
    transparent calc(var(--hh,46px)/2) var(--hh,46px)),
    repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh,46px)),
    var(--panel)}
.blk{position:absolute;left:1px;right:1px;border-radius:4px;pointer-events:none;z-index:1}
.blk.study{background:color-mix(in srgb,var(--study) 16%,transparent)}
.blk.play{background:color-mix(in srgb,var(--play) 16%,transparent)}
.blk i{position:absolute;top:0;left:3px;font-style:normal;font-size:7.5px;
  color:var(--dim);opacity:.85}
.course{position:absolute;left:1px;right:1px;z-index:2;border-radius:5px;
  padding:3px 4px;overflow:hidden;font-size:8.5px;line-height:1.2;color:var(--ink);
  font-weight:600;border-left:3px solid var(--course);
  background:color-mix(in srgb,var(--course) 22%,transparent);
  display:flex;flex-direction:column;justify-content:center;gap:2px}
.course .ct{display:block;overflow:hidden}
.course i{display:inline-block;font-style:normal;font-size:6px;font-weight:700;
  padding:0 2px;margin-right:2px;border-radius:2px;background:var(--course);
  color:#10131a;vertical-align:1px}
.course em{display:block;font-style:normal;font-size:8px;font-weight:600;
  color:var(--ink);opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt.course{border-left-color:var(--course)}
.ev{position:absolute;left:2px;right:2px;z-index:3;border-radius:5px;padding:2px 4px;
  font-size:9px;line-height:1.2;overflow:hidden;cursor:pointer;
  border-left:3px solid var(--cat,var(--other));
  background:color-mix(in srgb,var(--cat,var(--other)) 28%,transparent);
  color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:1px}
.ev.cat-study{--cat:var(--study)}
.ev.cat-play{--cat:var(--play)}
.ev.cat-life{--cat:var(--life)}
.ev.cat-other{--cat:var(--other)}
.ev b{font-size:7px;font-weight:400;color:var(--dim);white-space:nowrap}
.ev.touched{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 30%,transparent)}
.now{position:absolute;left:0;right:0;height:1.5px;background:var(--red);
  z-index:6;pointer-events:none}
.now .nowlab{position:absolute;right:1px;top:-12px;font-size:7.5px;color:#fff;
  background:var(--red);border-radius:3px;padding:0 3px;line-height:1.6}
.late{height:20px;flex:none;display:flex;gap:3px;align-items:center;overflow-x:auto;
  padding:0 2px;border-top:2px solid var(--line);background:var(--panel);
  scrollbar-width:none}
.late::-webkit-scrollbar{display:none}
.lt{flex:none;font-size:7.5px;padding:0 4px;border-radius:3px;background:var(--panel2);
  border-left:2px solid var(--cat);white-space:nowrap;color:var(--ink)}
.lt-empty{font-size:7.5px;color:var(--dim)}
.grid.placing{outline:1px dashed var(--study);outline-offset:-2px;
  background-color:color-mix(in srgb,var(--study) 6%,transparent)}

/* ---------- 底部任务栏 ---------- */
.minibar{position:relative;flex:none;height:var(--bar);z-index:30;
  display:flex;align-items:center;gap:4px;padding:0 8px env(safe-area-inset-bottom);
  overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);
  scrollbar-width:none;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.minibar::-webkit-scrollbar{display:none}
.minibar .mb-l{flex:none;font-size:9px;color:var(--dim);font-weight:700}
.minibar .mchip{flex:none;font-size:9px;padding:1px 5px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.minibar .mb-x{flex:none;margin-left:auto;font-size:8px;color:var(--dim)}
.app[data-drawer="open"] .minibar{transform:translateY(110%)}
.drawer{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:35;
  display:flex;flex-direction:column;background:var(--panel);
  border-top:1px solid var(--line);border-radius:12px 12px 0 0;
  box-shadow:0 -8px 26px #0007;transform:translateY(106%);
  transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.app[data-drawer="open"] .drawer{transform:translateY(0)}
.dtop{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--line)}
.dtop b{color:var(--ink);font-size:11px}
.dtop button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font-size:9px;border-radius:999px;padding:2px 8px}
.dbody{flex:1;overflow-y:auto;padding:2px 8px calc(26px + env(safe-area-inset-bottom))}
.sec{margin-top:6px}
.sec h3{margin:5px 2px 3px;font-size:9px;font-weight:700;color:var(--dim);letter-spacing:1px}
.card{display:flex;gap:6px;align-items:flex-start;padding:5px 6px;margin:4px 0;
  border-radius:8px;background:var(--panel2);border-left:3px solid var(--cat,var(--other))}
.card.cat-study{--cat:var(--study)}
.card.cat-play{--cat:var(--play)}
.card.cat-life{--cat:var(--life)}
.card.cat-other{--cat:var(--other)}
.card.selected{outline:1.5px solid var(--study)}
.card.just{animation:cardin .32s ease}
@keyframes cardin{from{transform:translateY(-3px);opacity:.45}to{transform:none;opacity:1}}
.card.done{opacity:.65}
.card.done .ct{text-decoration:line-through}
.cb{flex:none;width:15px;height:15px;margin-top:2px;padding:0;position:relative;
  border:1.5px solid var(--dim);border-radius:4px;background:none;
  transition:background .18s,border-color .18s}
.cb.on{background:var(--study);border-color:var(--study)}
.cb.on::after{content:"✓";position:absolute;inset:0;font-size:10px;color:#fff;
  line-height:12px;text-align:center}
.cmain{min-width:0;flex:1}
.ct{font-size:12px;line-height:1.3;word-break:break-all}
.cm{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:2px}
.tag{font-style:normal;font-size:8px;padding:0 3px;border-radius:3px;
  background:var(--bg);color:var(--dim);white-space:nowrap}
.tag.study{color:var(--study)}
.tag.play{color:var(--play)}
.tag.life{color:var(--life)}
.tag.big{color:var(--hot)}
.tag.new{color:#08111f;background:var(--study);font-weight:700}
.lenbox{display:flex;align-items:center;gap:2px;margin-left:auto}
.lenbox button{width:16px;height:16px;padding:0;font-size:11px;line-height:1;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px}
.len{font-size:9px;color:var(--dim);min-width:26px;text-align:center}
.placebtn{font-size:8px;border:1px solid var(--line);background:var(--bg);
  color:var(--dim);border-radius:4px;padding:1px 4px}
details.trash{margin:8px 0;border-top:1px solid var(--line);padding-top:6px}
details.trash summary{font-size:9px;color:var(--dim)}
.trow{display:flex;justify-content:space-between;gap:8px;font-size:10px;
  color:var(--dim);padding:2px 2px}
.trow i{font-style:normal;font-size:8px;flex:none}

/* ---------- 悬浮按钮 ---------- */
.dock{position:absolute;right:8px;bottom:calc(var(--bar) + 8px);z-index:40;
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;
  transition:bottom .3s cubic-bezier(.2,.7,.2,1)}
.app[data-drawer="open"] .dock{bottom:calc(46% + 8px)}
.copy{border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  font-size:10px;border-radius:999px;padding:7px 11px;box-shadow:0 4px 14px #0005;
  transition:all .25s}
.copy.on{color:#08111f;background:var(--study);border-color:var(--study);
  font-weight:800;box-shadow:0 4px 18px color-mix(in srgb,var(--study) 55%,transparent)}
.copy:disabled{opacity:.5}
.fab{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:18px;line-height:1;
  box-shadow:0 6px 20px #0008;position:relative;padding:0}
.fab i{position:absolute;top:-2px;right:-2px;font-style:normal;font-size:9px;
  background:var(--red);color:#fff;border-radius:999px;min-width:16px;height:16px;
  line-height:16px;padding:0 3px;text-align:center}

/* ---------- 浮层 ---------- */
.modal{position:absolute;inset:0;z-index:60;background:#000a;display:flex;
  align-items:flex-end;backdrop-filter:blur(2px)}
.modal[hidden]{display:none}
.sheet{width:100%;height:66.67%;max-height:66.67%;overflow:hidden;background:var(--panel);
  border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column}
.sheet .handle{flex:none;width:40px;height:4px;border-radius:2px;
  background:var(--line);margin:0 auto 10px}
.sheet .body{flex:1;min-height:0;overflow-y:auto;padding-bottom:4px}
.sheet h2{margin:0;font-size:20px;line-height:1.3;font-weight:800;word-break:break-all}
.sheet .loc{display:flex;align-items:baseline;gap:8px;margin-top:10px;
  font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
.sheet .loc span{flex:none;font-size:10px;font-weight:400;color:var(--dim)}
.sheet .meta{color:var(--dim);font-size:11px;margin:6px 0 8px;line-height:1.7}
.sheet .rows{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.sheet .row{display:flex;gap:10px;padding:7px 0;font-size:12px;line-height:1.45;
  border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.sheet .row i{flex:none;width:48px;font-style:normal;font-size:11px;color:var(--dim)}
.sheet .row b{min-width:0;font-weight:500;color:var(--ink);word-break:break-all}
.sheet .acts{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}
.sheet .acts button{flex:1;min-width:68px;padding:10px 6px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12px}
.sheet .acts button.primary{background:var(--study);border-color:var(--study);
  color:#08111f;font-weight:800}
.codebox{width:100%;height:220px;font:11px/1.55 ui-monospace,Consolas,monospace;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px;resize:vertical}
.toast{position:absolute;left:50%;bottom:calc(var(--bar) + 64px);transform:translate(-50%,10px);
  z-index:70;max-width:88vw;text-align:center;background:#000d;color:#fff;
  font-size:11px;padding:7px 12px;border-radius:999px;opacity:0;
  pointer-events:none;transition:all .22s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.selbar{position:absolute;left:8px;right:8px;bottom:calc(var(--bar) + 70px);z-index:45;
  display:flex;align-items:center;gap:8px;background:var(--study);color:#08111f;
  border-radius:10px;padding:7px 10px;font-size:11px;box-shadow:0 6px 20px #0008}
.selbar[hidden]{display:none}
.selbar b{font-weight:800}
.selbar button{margin-left:auto;border:0;background:#08111f33;color:#08111f;
  font-size:10px;font-weight:800;border-radius:6px;padding:3px 8px}
.warnb{position:absolute;left:8px;right:8px;top:38px;z-index:50;background:#7a5a00;
  color:#ffe9b0;font-size:10px;line-height:1.5;padding:6px 9px;border-radius:8px}
.warnb[hidden]{display:none}

/* ---------- 纯日历模式 ---------- */
.app.cal .drawer,.app.cal .minibar{transform:translateY(110%)}
.app.cal .strip,.app.cal .rail-pad{display:none}
.app.cal .dock{bottom:calc(var(--bar) + 44px)}
.bigbar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:30;
  min-height:var(--bar);align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;
  background:var(--panel);border-top:1px solid var(--line);
  padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
.bigbar::-webkit-scrollbar{display:none}
.app.cal .bigbar{display:flex}
.bigtag{flex:none;font-size:9px;padding:2px 7px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.bigtag b{color:var(--hot);font-weight:800}
.bigtag.empty{color:var(--dim)}

@keyframes flashp{0%,100%{box-shadow:0 0 0 0 transparent}
  45%{box-shadow:0 0 0 3px var(--red)}}
.flash{animation:flashp .7s ease-in-out 2}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app" class="app" data-drawer="mini">
  <header class="hdr">
    <span class="logo">行程</span>
    <span class="dt" id="hdt">2026-10-31</span>
    <span class="hnav">
      <button data-act="wk" data-d="-7" aria-label="上一周">−</button>
      <span id="wk">第 1 周</span>
      <button data-act="wk" data-d="7" aria-label="下一周">+</button>
    </span>
    <button class="hbtn" data-act="mode">日历</button>
  </header>
  <div id="board" class="board" data-expand="none"></div>
  <div id="minibar" class="minibar" data-act="drawer"></div>
  <aside id="drawer" class="drawer" aria-label="任务栏">
    <div class="dtop">
      <b>任务栏</b>
      <span style="display:flex;gap:6px">
        <button data-act="recopy">上次码</button>
        <button data-act="drawer">收起</button>
      </span>
    </div>
    <div id="dbody" class="dbody"></div>
  </aside>
  <div id="bigbar" class="bigbar"></div>
  <div id="selbar" class="selbar" hidden></div>
  <div id="warnb" class="warnb" hidden></div>
  <div class="dock">
    <button id="copybtn" class="copy" data-act="copy" disabled>复制计划</button>
    <button class="fab" data-act="drawer" aria-label="任务栏">≡<i id="fabc"></i></button>
  </div>
  <div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast"></div>
</div>

"start":"08:00","end":"09:35","loc":"一教 A阶102"},{"title":"高等数学A","weekday":3,"start":"09:45","end":"11:25","loc":"一教 A阶101"},{"title":"现代工程图学","weekday":3,"start":"13:30","end":"15:05","loc":"二教 C306"},{"title":"思想政治理论课-1","weekday":4,"start":"09:45","end":"12:15","loc":"二教 C302"},{"title":"体育","weekday":4,"start":"13:30","end":"15:05","loc":"体育馆 乒乓球馆"},{"title":"高等数学A","weekday":5,"start":"08:00","end":"09:35","loc":"一教 A阶101"}],"termStart":"2026-10-26","termWeek":9};</script>
<script>
window.__jyBoot = function(){
'use strict';
var B = window.BOARD || {};
var COURSES = (B.courses || []).map(function(c, i){
  var o = {}; for(var k in c) o[k] = c[k]; o._idx = i; return o;
});
var TERM_START = B.termStart || B.today;
var TERM_WEEK = B.termWeek || 1;
var HEAD = 40, STRIP = 26, LATEH = 20;
var DSTART = 6, DEND = 20 + 25/60;  // 06:00 → 20:25，晚课进网格
var HOUR = 46, PXMIN = HOUR/60, GRIDH = (DEND-DSTART)*HOUR;
var WD = '日一二三四五六';
var KEY = 'jy.ops.v1';
var app = document.getElementById('app');
var board = document.getElementById('board');
var minibar = document.getElementById('minibar');
var dbody = document.getElementById('dbody');
var copybtn = document.getElementById('copybtn');
var fabc = document.getElementById('fabc');
var modal = document.getElementById('modal');
var sheet = document.getElementById('sheet');
var selbar = document.getElementById('selbar');
var warnb = document.getElementById('warnb');
var bigbar = document.getElementById('bigbar');
var hdt = document.getElementById('hdt');
var wk = document.getElementById('wk');
var toastEl = document.getElementById('toast');
var appState = {ops:[], anchor:B.today, sel:null, lastCode:'', storageOk:true,
  toastTimer:null, pulse:null};
var HOURS = []; for (var h = DSTART; h <= DEND; h++) HOURS.push(h);

/* ---------------- 工具 ---------------- */
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function wall(ms){ return new Date(ms + 8*3600*1000); }
function dayOfMs(ms){ var w = wall(ms - 4*3600*1000);
  return w.getUTCFullYear()+'-'+pad(w.getUTCMonth()+1)+'-'+pad(w.getUTCDate()); }
function dayOfIso(iso){ return dayOfMs(Date.parse(iso)); }
function minOfIso(iso){ var w = wall(Date.parse(iso)); return w.getUTCHours()*60 + w.getUTCMinutes(); }
function hhmmIso(iso){ var w = wall(Date.parse(iso)); return pad(w.getUTCHours())+':'+pad(w.getUTCMinutes()); }
function md(key){ var p = key.split('-'); return parseInt(p[1],10)+'/'+parseInt(p[2],10); }
function weekdayOf(key){ return wall(Date.parse(key+'T12:00:00+08:00')).getUTCDay(); }
function addDays(key, n){ return dayOfMs(Date.parse(key+'T12:00:00+08:00') + n*86400000); }
function isoAt(key, minutes){ return key+'T'+pad(Math.floor(minutes/60))+':'+pad(minutes%60)+':00+08:00'; }
function shift(iso, minutes){
  var w = wall(Date.parse(iso) + minutes*60000);
  return w.getUTCFullYear()+'-'+pad(w.getUTCMonth()+1)+'-'+pad(w.getUTCDate())+'T'
    + pad(w.getUTCHours())+':'+pad(w.getUTCMinutes())+':00+08:00';
}
function daysBetween(a, b){
  return Math.round((Date.parse(a+'T12:00:00+08:00') - Date.parse(b+'T12:00:00+08:00'))/86400000);
}
function mondayOf(key){ return addDays(key, -((weekdayOf(key)+6)%7)); }
function semWeek(key){
  var diff = Math.round((Date.parse(mondayOf(key)+'T12:00:00+08:00')
    - Date.parse(mondayOf(TERM_START)+'T12:00:00+08:00')) / 604800000);
  return TERM_WEEK + diff;
}
function weekLabel(key){
  var n = semWeek(key);
  return n >= 1 ? '第'+n+'周' : '学期前';
}
function coursesOf(day){
  var wd = ((weekdayOf(day)+6)%7)+1;
  return COURSES.filter(function(c){ return c.weekday === wd; });
}
function dayLabel(key){
  var diff = daysBetween(key, B.today);
  if(diff === 0) return '今天';
  if(diff === 1) return '明天';
  if(diff === 2) return '后天';
  if(diff === -1) return '昨天';
  if(diff === -2) return '前天';
  return md(key)+' 周'+WD[weekdayOf(key)];
}
function shortTitle(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) : s; }
function catName(c){ return c === 'study' ? '学' : c === 'play' ? '玩' : c === 'life' ? '生活' : '事项'; }
function catClass(c){ return 'cat-' + (c === 'study' || c === 'play' || c === 'life' ? c : 'other'); }
function hm2min(v){ var p = String(v).split(':'); return parseInt(p[0],10)*60 + parseInt(p[1],10); }

/* ---------------- 视口适配：页面卡死在单屏内 ---------------- */
function fitViewport(){
  var h = 0;
  if(window.visualViewport && window.visualViewport.height) h = window.visualViewport.height;
  else if(window.innerHeight) h = window.innerHeight;
  var de = document.documentElement;
  if(h > 0 && de && de.style && de.style.setProperty){
    de.style.setProperty('--app-h', h + 'px');
  }
}
function fitBoard(){
  var r = board.getBoundingClientRect ? board.getBoundingClientRect() : null;
  var height = r ? r.height : 0;
  if(!height || height < 160){
    height = ((window.innerHeight || 780) - 150);
  }
  // 13 个小时刻度必须一屏放下，所以每小时高度由剩余空间算出来
  var avail = height - HEAD - STRIP - LATEH;
  var per = avail / (DEND - DSTART);
  HOUR = Math.max(20, Math.min(110, per));
  PXMIN = HOUR / 60;
  GRIDH = (DEND - DSTART) * HOUR;
  if(board.style && board.style.setProperty){
    board.style.setProperty('--hh', HOUR + 'px');
    board.style.setProperty('--gh', GRIDH + 'px');
  }
}

/* ---------------- 存储 ---------------- */
function loadOps(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return [];
    var arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return [];
    var gt = Date.parse(B.generatedAt);
    return arr.filter(function(o){
      return o && o.code && o.kind && !(o.sentAt && o.sentAt <= gt);
    });
  }catch(e){ appState.storageOk = false; return []; }
}
function saveOps(){
  try{
    // 多个标签页共用一份存储：写之前先合并，别让新标签把旧标签刚点的操作盖掉
    var raw = localStorage.getItem(KEY);
    var stored = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(stored)) stored = [];
    var gt = Date.parse(B.generatedAt);
    stored = stored.filter(function(o){
      return o && o.id && !(o.sentAt && o.sentAt <= gt);
    });
    var byId = {};
    stored.forEach(function(o){ byId[o.id] = o; });
    appState.ops.forEach(function(o){ if(o.id) byId[o.id] = o; });
    appState.ops = Object.keys(byId).map(function(k){ return byId[k]; })
      .sort(function(a, b){ return (a.at || 0) - (b.at || 0); });
    localStorage.setItem(KEY, JSON.stringify(appState.ops));
    appState.storageOk = true;
  }catch(e){ appState.storageOk = false; }
}

/* ---------------- 数据模型 ---------------- */
function viewTasks(){
  var list = (B.tasks || []).map(function(t){
    var c = {}; for(var k in t) c[k] = t[k];
    c._done = false; c._slot = t.slot || null; c._touched = false;
    return c;
  });
  var by = {}; list.forEach(function(t){ by[t.code] = t; });
  appState.ops.forEach(function(op){
    var t = by[op.code]; if(!t) return;
    t._touched = true;
    if(op.kind === 'D') t._done = true;
    else if(op.kind === 'U') t._done = false;
    else if(op.kind === 'L'){
      t.estMin = op.minutes;
      if(t._slot){ t._slot = {start:t._slot.start, end:shift(t._slot.start, op.minutes)}; }
    } else if(op.kind === 'P'){
      t._slot = {start:op.start, end:shift(op.start, op.minutes)};
      t.block = (t.category === 'study' || t.category === 'play') ? t.category : null;
    }
  });
  return list;
}
function findAll(code){
  var list = viewTasks();
  for(var i=0;i<list.length;i++){ if(list[i].code === code) return list[i]; }
  return null;
}
function findPending(code){
  var list = viewTasks();
  for(var i=0;i<list.length;i++){ if(list[i].code === code && !list[i]._done) return list[i]; }
  return null;
}
function addOp(op){
  op.id = Math.random().toString(16).slice(2,8);
  op.at = Date.now();
  op.sentAt = 0;
  appState.ops.push(op);
  appState.pulse = op.code;
  saveOps();
  render();
}

/* ---------------- 布局计算 ---------------- */
function blocksOf(day){
  var wd = ((weekdayOf(day)+6)%7)+1;
  return (B.blocks||[]).filter(function(b){
    return (b.weekdays||[]).indexOf(wd) >= 0;
  }).map(function(b){
    return {start:hm2min(b.start), end:hm2min(b.end), kind:b.kind, label:b.label};
  });
}
function dayTasks(list, day){
  return list.filter(function(t){
    if(t._slot && t._slot.start) return dayOfIso(t._slot.start) === day;
    if(t.deadline) return dayOfIso(t.deadline) === day;
    if(t.window && t.window.start) return dayOfIso(t.window.start) <= day && day <= dayOfIso(t.window.end);
    return false;
  });
}

/* ---------------- 渲染 ---------------- */
function render(){
  fitViewport();
  fitBoard();
  var st = board.scrollTop;
  var all = viewTasks();
  var pending = all.filter(function(t){ return !t._done; });
  var done = all.filter(function(t){ return t._done; });

  hdt.textContent = md(B.today)+' 周'+WD[weekdayOf(B.today)]+' · '+pending.length+' 项待办';
  wk.textContent = weekLabel(appState.anchor);

  board.innerHTML = railHtml() + columnHtml(addDays(appState.anchor,0), 0, pending)
    + columnHtml(addDays(appState.anchor,1), 1, pending)
    + columnHtml(addDays(appState.anchor,2), 2, pending);
  board.scrollTop = st;

  renderDrawer(pending, done);
  if(appState.pulse){
    var pn = document.querySelectorAll('[data-code="'+appState.pulse+'"]');
    for(var pi = 0; pi < pn.length; pi++){ pn[pi].classList.add('just'); }
    appState.pulse = null;
  }
  renderMini(pending);
  renderDock(pending);
  renderBigbar(pending);
  renderSel();
  warnb.hidden = appState.storageOk;
  if(!appState.storageOk){
    warnb.textContent = '本机没保存住改动（浏览器禁用了本地存储）：离开本页前请先复制同步码，否则这些点击会丢。';
  }
  positionNow();
}

function hhmmH(v){ var m = Math.round(v*60); return pad(Math.floor(m/60))+':'+pad(m%60); }
function railHtml(){
  var out = '<div class="rail"><div class="rail-head"></div><div class="rail-pad"></div>';
  out += '<div class="rail-body" style="height:'+GRIDH+'px">';
  HOURS.forEach(function(h){
    out += '<span class="rl" style="top:'+((h-DSTART)*HOUR-5)+'px">'+h+'</span>';
  });
  out += '<span class="rl" style="top:'+(GRIDH-7)+'px">'+hhmmH(DEND)+'</span>';
  out += '<span class="nowdot" data-now style="display:none"></span></div></div>';
  return out;
}

function columnHtml(day, idx, pending){
  var items = dayTasks(pending, day);
  var timed = [], loose = [];
  items.forEach(function(t){
    if(t._slot && t._slot.start && dayOfIso(t._slot.start) === day) timed.push(t);
    else loose.push(t);
  });

  var gh = '';
  blocksOf(day).forEach(function(b){
    var a = Math.max(b.start, DSTART*60), z = Math.min(b.end, DEND*60);
    if(z <= a) return;
    gh += '<div class="blk '+b.kind+'" style="top:'+((a-DSTART*60)*PXMIN)+'px;height:'
      + ((z-a)*PXMIN)+'px"><i>'+esc(b.label || (b.kind === 'study' ? '学' : '玩'))+'</i></div>';
  });

  var late = [];
  var lateCourses = [];
  coursesOf(day).forEach(function(c){
    var a = hm2min(c.start), z = hm2min(c.end);
    if(a >= DEND*60){ lateCourses.push(c); return; }
    var top = Math.max(0, (a - DSTART*60) * PXMIN);
    var bottom = Math.min(DEND*60, Math.max(z, a + 15));
    var ch = Math.max(18, (bottom - Math.max(a, DSTART*60)) * PXMIN);
    gh += '<div class="course" data-act="course" data-ci="'+c._idx
      + '" style="top:'+top+'px;height:'+ch+'px"'
      + ' title="'+esc(c.title+' '+c.start+'-'+c.end+(c.loc ? ' '+c.loc : ''))+'">'
      + '<span class="ct"><i>课</i>'+esc(c.title)+'</span>'
      + '<em>'+esc(c.loc || '')+'</em></div>';
    if(z > DEND*60) lateCourses.push(c);
  });

  timed.forEach(function(t){
    var a = minOfIso(t._slot.start);
    var z = t._slot.end ? minOfIso(t._slot.end) : a + (t.estMin || 30);
    if(a >= DEND*60){ late.push(t); return; }
    var top = Math.max(0, (a - DSTART*60) * PXMIN);
    var bottom = Math.min(DEND*60, Math.max(z, a + 15));
    var tall = Math.max(20, (bottom - Math.max(a, DSTART*60)) * PXMIN);
    gh += '<div class="ev '+catClass(t.category)+(t._touched?' touched':'')
      + '" data-act="focus" data-code="'+t.code+'" style="top:'+top+'px;height:'+tall+'px"'
      + ' title="'+esc(t.title)+'">'+esc(t.title)
      + '<b>'+hhmmIso(t._slot.start)+'</b></div>';
    if(z > DEND*60) late.push(t);
  });

  var todayLive = dayOfMs(Date.now());
  if(day === todayLive){
    gh += '<div class="now" data-now style="display:none"><span class="nowlab"></span></div>';
  }

  var lateBits = [];
  late.forEach(function(t){
    lateBits.push('<span class="lt '+catClass(t.category)+'" data-act="focus" data-code="'+t.code+'">'
      + esc(shortTitle(t.title,5))+' '+hhmmIso(t._slot.start)+'</span>');
  });
  lateCourses.forEach(function(c){
    lateBits.push('<span class="lt course" data-act="course" data-ci="'+c._idx+'">'
      + esc(shortTitle(c.title,5))+' '+c.start+'</span>');
  });
  var lateHtml = lateBits.length ? lateBits.join('')
    : '<span class="lt-empty">'+esc(hhmmH(DEND))+' 之后 · 空</span>';

  var strip = loose.length
    ? loose.map(function(t){
        return '<span class="chip '+catClass(t.category)+'" data-act="focus" data-code="'+t.code+'"'
          + ' title="'+esc(t.title)+'">'+esc(shortTitle(t.title,6))+'</span>';
      }).join('')
    : '';

  var expanded = board.dataset.expand === ('d'+idx);
  var head = '<div class="dhead" data-act="expand" data-day="'+idx+'">'
    + '<span class="dl">'+dayLabel(day)+'</span>'
    + '<span class="dd">'+md(day)+' 周'+WD[weekdayOf(day)]+(items.length?' · '+items.length:'')
    + '</span><span class="dexp">'+(expanded?'⇤':'⤢')+'</span></div>';

  return '<section class="col" data-day="'+idx+'">'+head
    + '<div class="strip'+(strip?'':' empty')+'">'+(strip || '待排')+'</div>'
    + '<div class="grid'+(appState.sel?' placing':'')+'" data-day="'+day+'" data-idx="'+idx+'">'
    + gh+'</div>'
    + '<div class="late">'+lateHtml+'</div></section>';
}

function cardHtml(t){
  var chips = '<i class="tag '+t.category+'">'+catName(t.category)+'</i>';
  if(t.big) chips += '<i class="tag big">大事</i>';
  if(t.repeat) chips += '<i class="tag">🔁</i>';
  if(t.deadline) chips += '<i class="tag">'+dayLabel(dayOfIso(t.deadline))+' ';
  if(t.deadline) chips += hhmmIso(t.deadline)+'</i>';
  if(t._slot) chips += '<i class="tag">'+dayLabel(dayOfIso(t._slot.start))+' ';
  if(t._slot) chips += hhmmIso(t._slot.start)+'</i>';
  if(t.loc) chips += '<i class="tag">'+esc(t.loc)+'</i>';
  if(t._touched) chips += '<i class="tag new">未同步</i>';

  return '<div class="card '+catClass(t.category)+(t._done?' done':'')
    + (appState.sel === t.code ? ' selected' : '')+'" data-code="'+t.code+'">'
    + '<button class="cb'+(t._done?' on':'')+'" data-act="check" data-code="'+t.code+'"'
    + ' aria-label="完成"></button>'
    + '<div class="cmain"><div class="ct" data-act="focus" data-code="'+t.code+'"'
    + ' role="button">'+esc(t.title)+'</div><div class="cm">'+chips
    + '<span class="lenbox">'
    + '<button data-act="minus" data-code="'+t.code+'" aria-label="减时长">−</button>'
    + '<span class="len">'+t.estMin+'分</span>'
    + '<button data-act="plus" data-code="'+t.code+'" aria-label="加时长">+</button>'
    + '</span>'
    + '<button class="placebtn" data-act="place" data-code="'+t.code+'">⌖ 落位</button>'
    + '</div></div></div>';
}

function renderDrawer(pending, done){
  var groups = [['overdue','逾期'],['today','今天'],['tomorrow','明天'],
                ['dayAfter','后天'],['week','本周'],['countdown','大事'],['backlog','其他']];
  var html = '';
  groups.forEach(function(g){
    var items = pending.filter(function(t){ return t.bucket === g[0]; });
    if(!items.length) return;
    html += '<div class="sec"><h3>'+g[1]+' · '+items.length+'</h3>'
      + items.map(cardHtml).join('')+'</div>';
  });
  if(!pending.length) html += '<div class="sec"><h3>没有待办</h3></div>';
  if(done.length){
    html += '<div class="sec"><h3>刚完成 · 待同步 · '+done.length+'</h3>'
      + done.map(cardHtml).join('')+'</div>';
  }
  var tr = B.trash || [];
  if(tr.length){
    html += '<details class="trash"><summary>回收站 · '+tr.length+'（已完成/已删除，暂不展示）</summary>'
      + tr.map(function(t){
          return '<div class="trow"><span>'+esc(t.title)+'</span><i>'
            + (t.trashState === 'done' ? '已完成' : '已删')+'</i></div>';
        }).join('')
      + '</details>';
  }
  dbody.innerHTML = html;
}

function renderMini(pending){
  var parts = pending.slice(0, 10).map(function(t){
    return '<span class="mchip">'+esc(shortTitle(t.title, 2))+'</span>';
  }).join('');
  minibar.innerHTML = '<span class="mb-l">任务栏 '+pending.length+'</span>'+parts
    + '<span class="mb-x">展开 ▲</span>';
}

function renderDock(pending){
  var unsent = appState.ops.filter(function(o){ return !o.sentAt; }).length;
  copybtn.disabled = unsent === 0;
  copybtn.className = 'copy' + (unsent ? ' on' : '');
  copybtn.textContent = unsent ? '复制同步码 · '+unsent+' 项' : '复制计划';
  fabc.textContent = pending.length || '';
  fabc.style.display = pending.length ? '' : 'none';
}

function renderBigbar(pending){
  var big = pending.filter(function(t){ return t.bucket === 'countdown'; });
  if(!big.length){ bigbar.innerHTML = '<span class="bigtag empty">大事倒计时 · 暂无</span>'; return; }
  bigbar.innerHTML = '<span class="bigtag">大事 '+big.length+'</span>' + big.map(function(t){
    var left = t.deadline ? daysBetween(dayOfIso(t.deadline), B.today) : null;
    return '<span class="bigtag">'+esc(t.title)+' · '
      + (left == null ? '待定' : '<b>'+left+'</b> 天')+'</span>';
  }).join('');
}

function renderSel(){
  var on = !!appState.sel;
  app.classList.toggle('placing', on);
  if(!on){ selbar.hidden = true; return; }
  var t = findPending(appState.sel);
  if(!t){ appState.sel = null; app.classList.remove('placing'); selbar.hidden = true; return; }
  selbar.hidden = false;
  selbar.innerHTML = '正在放置：<b>'+esc(t.title)+'</b> · 点日历里的一格放下'
    + '<button data-act="cancelsel">取消</button>';
}

/* ---------------- 红线 ---------------- */
function positionNow(){
  var m = wall(Date.now());
  var minutes = m.getUTCHours()*60 + m.getUTCMinutes();
  var ok = minutes >= DSTART*60 && minutes <= DEND*60;
  var y = (minutes - DSTART*60) * PXMIN;
  var nodes = document.querySelectorAll('[data-now]');
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i];
    if(!ok){ el.style.display = 'none'; continue; }
    el.style.display = '';
    el.style.top = y+'px';
    var lab = el.querySelector('.nowlab');
    if(lab) lab.textContent = pad(Math.floor(minutes/60))+':'+pad(minutes%60);
  }
}

/* ---------------- 弹窗 ---------------- */
function sheetHead(){ return '<div class="handle"></div>'; }
function rowHtml(label, value){
  return '<div class="row"><i>'+esc(label)+'</i><b>'+esc(value)+'</b></div>';
}
function showModal(code){
  var t = findAll(code); if(!t) return;
  var rows = '';
  if(t.deadline) rows += rowHtml('截止', dayLabel(dayOfIso(t.deadline))+' '+hhmmIso(t.deadline));
  if(t._slot) rows += rowHtml('计划', dayLabel(dayOfIso(t._slot.start))+' '
    + hhmmIso(t._slot.start)+'–'+hhmmIso(t._slot.end));
  if(t.window && t.window.start && !t._slot){
    rows += rowHtml('可做', dayLabel(dayOfIso(t.window.start))+' → '+dayLabel(dayOfIso(t.window.end)));
  }
  rows += rowHtml('类型', catName(t.category)+(t.big ? ' · 大事' : '')
    + (t.repeat ? (t.repeat.unit === 'day' ? ' · 每天重复' : ' · 每周重复') : ''));
  rows += rowHtml('时长', t.estMin+' 分钟');
  if(t.tags && t.tags.length) rows += rowHtml('标签', t.tags.join(' '));
  if(t._touched) rows += rowHtml('同步', '未同步（右下角复制同步码）');

  sheet.innerHTML = sheetHead()
    + '<div class="body">'
    + '<h2>'+esc(t.title)+'</h2>'
    + (t.loc ? '<div class="loc"><span>地点</span>'+esc(t.loc)+'</div>' : '')
    + '<div class="rows">'+rows+'</div>'
    + '</div>'
    + '<div class="acts">'
    + '<button class="primary" data-act="mcheck" data-code="'+t.code+'">'
    + (t._done ? '取消完成' : '勾完成')+'</button>'
    + '<button data-act="mminus" data-code="'+t.code+'">−15</button>'
    + '<button data-act="mplus" data-code="'+t.code+'">+15</button>'
    + '<button data-act="mplace" data-code="'+t.code+'">放到日历</button>'
    + '<button data-act="close">关闭</button></div>';
  modal.hidden = false;
}

function showCode(code, copied){
  sheet.innerHTML = sheetHead()
    + '<div class="body"><h2>同步码</h2>'
    + '<div class="meta">'+(copied ? '已复制。粘贴到 QQ 发给机器人，它会落盘并重发新版看板。'
      : '没复制成功——长按下面的框全选复制。')+'</div>'
    + '<textarea class="codebox" id="codebox" readonly>'+esc(code)+'</textarea></div>'
    + '<div class="acts"><button class="primary" data-act="copyagain">再复制一次</button>'
    + '<button data-act="close">关闭</button></div>';
  modal.hidden = false;
  var ta = document.getElementById('codebox');
  if(ta){ ta.focus(); ta.select(); }
}

function showCourse(idx){
  var c = COURSES[idx]; if(!c) return;
  var names = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  sheet.innerHTML = sheetHead()
    + '<div class="body">'
    + '<h2>'+esc(c.title)+'</h2>'
    + (c.loc ? '<div class="loc"><span>地点</span>'+esc(c.loc)+'</div>' : '')
    + '<div class="rows">'
    + rowHtml('时间', names[c.weekday]+' '+c.start+'–'+c.end)
    + rowHtml('类型', '每周固定课')
    + '</div></div>'
    + '<div class="acts"><button data-act="close">关闭</button></div>';
  modal.hidden = false;
}

function closeModal(){ modal.hidden = true; sheet.innerHTML = ''; }

/* ---------------- 提示 ---------------- */
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(appState.toastTimer);
  appState.toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
}

/* ---------------- 复制 ---------------- */
function rand4(){
  var a = '0123456789abcdef', s = '';
  for(var i=0;i<4;i++) s += a[Math.floor(Math.random()*16)];
  return s;
}
function buildCode(){
  var unsent = appState.ops.filter(function(o){ return !o.sentAt; });
  var lines = ['JY'+(B.boardId||'0000')+'-'+rand4()];
  unsent.forEach(function(o){
    var title = String(o.title || '').replace(/\s+/g, ' ');
    if(o.kind === 'D' || o.kind === 'U') lines.push(o.kind+' '+o.code+' '+title);
    else if(o.kind === 'L') lines.push('L '+o.code+' '+o.minutes+' '+title);
    else if(o.kind === 'P') lines.push('P '+o.code+' '+o.start.slice(0,16)+' '+o.minutes+' '+title);
  });
  return lines.join('\n');
}
function fallbackCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copyText(text){
  return new Promise(function(resolve){
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(
        function(){ resolve(true); },
        function(){ resolve(fallbackCopy(text)); }
      );
      return;
    }
    resolve(fallbackCopy(text));
  });
}
function doCopy(){
  var unsent = appState.ops.filter(function(o){ return !o.sentAt; });
  if(!unsent.length){ toast('没有新改动，按钮是灰的'); return; }
  var code = buildCode();
  appState.lastCode = code;
  copyText(code).then(function(ok){
    var now = Date.now();
    unsent.forEach(function(o){ o.sentAt = now; });
    saveOps();
    render();
    showCode(code, ok);
  });
}

/* ---------------- 操作 ---------------- */
function toggleDone(code){
  var t = findAll(code); if(!t) return;
  addOp({kind: t._done ? 'U' : 'D', code: t.code, title: t.title});
  if(!modal.hidden) showModal(code);
  toast(t._done ? '已取消完成' : '已勾完成（待同步）');
}
function adjust(code, delta){
  var t = findAll(code); if(!t) return;
  var next = Math.max(15, Math.min(480, (t.estMin || 30) + delta));
  if(next === t.estMin){ toast('已经到上下限了'); return; }
  addOp({kind:'L', code:t.code, title:t.title, minutes:next});
  if(!modal.hidden) showModal(code);
}
function startPlace(code){
  var t = findPending(code);
  if(!t){ toast('这条已经完成了'); return; }
  appState.sel = code;
  closeModal();
  render();
  toast('点日历里的一格放下');
}
function placeAt(grid, clientY){
  var r = grid.getBoundingClientRect();
  var m = (clientY - r.top) / PXMIN + DSTART*60;
  m = Math.round(m/15) * 15;
  m = Math.max(DSTART*60, Math.min(DEND*60 - 15, m));
  placeSelected(grid.dataset.day, m);
}
function placeSelected(day, minutes){
  var t = findPending(appState.sel);
  appState.sel = null;
  if(!t){ render(); return; }
  var start = isoAt(day, minutes);
  addOp({kind:'P', code:t.code, title:t.title, start:start, minutes:t.estMin || 30});
  toast('已排到 '+md(day)+' '+pad(Math.floor(minutes/60))+':'+pad(minutes%60));
}
function focusTask(code){
  var t = findAll(code); if(!t){ toast('这条已经不在待办了'); return; }
  var day = null;
  if(t._slot && t._slot.start) day = dayOfIso(t._slot.start);
  else if(t.deadline) day = dayOfIso(t.deadline);
  else if(t.window && t.window.start) day = dayOfIso(t.window.start);
  var span = [appState.anchor, addDays(appState.anchor,1), addDays(appState.anchor,2)];
  if(day && span.indexOf(day) < 0 && Math.abs(daysBetween(day, B.today)) < 60){
    appState.anchor = day;
    render();
  }
  var els = document.querySelectorAll('[data-code="'+code+'"]');
  for(var i=0;i<els.length;i++){
    (function(el){
      el.classList.add('flash');
      setTimeout(function(){ el.classList.remove('flash'); }, 1600);
    })(els[i]);
  }
  showModal(code);
}
function setDrawer(open){
  app.dataset.drawer = open ? 'open' : 'mini';
}
function toggleMode(){
  var cal = app.classList.toggle('cal');
  var btn = document.querySelector('[data-act="mode"]');
  if(btn) btn.textContent = cal ? '计划' : '日历';
  if(btn) btn.classList.toggle('on', cal);
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el){
    if(appState.sel && !e.target.closest('#board')){ appState.sel = null; render(); }
    return;
  }
  var act = el.dataset.act;
  var code = el.dataset.code;

  if(act === 'expand'){ 
    var d = el.dataset.day;
    board.dataset.expand = (board.dataset.expand === 'd'+d) ? 'none' : 'd'+d;
    render();
    return;
  }
  if(act === 'drawer'){ setDrawer(app.dataset.drawer !== 'open'); return; }
  if(act === 'copy'){ doCopy(); return; }
  if(act === 'recopy'){
    if(appState.lastCode) showCode(appState.lastCode, true);
    else toast('还没有生成过同步码');
    return;
  }
  if(act === 'check'){ toggleDone(code); return; }
  if(act === 'minus'){ adjust(code, -15); return; }
  if(act === 'plus'){ adjust(code, 15); return; }
  if(act === 'place'){ startPlace(code); return; }
  if(act === 'focus'){ focusTask(code); return; }
  if(act === 'course'){
    if(appState.sel){
      var g = e.target.closest('.grid');
      if(g){ placeAt(g, e.clientY); return; }
    }
    showCourse(parseInt(el.dataset.ci, 10));
    return;
  }
  if(act === 'wk'){ appState.anchor = addDays(appState.anchor, parseInt(el.dataset.d,10)); render(); return; }
  if(act === 'mode'){ toggleMode(); return; }
  if(act === 'cancelsel'){ appState.sel = null; render(); return; }
  if(act === 'close'){ closeModal(); return; }
  if(act === 'mcheck'){ toggleDone(code); return; }
  if(act === 'mminus'){ adjust(code, -15); return; }
  if(act === 'mplus'){ adjust(code, 15); return; }
  if(act === 'mplace'){ startPlace(code); return; }
  if(act === 'copyagain'){
    var box = document.getElementById('codebox');
    if(box){ copyText(box.value).then(function(ok){ toast(ok ? '已复制' : '复制失败，长按全选'); }); }
    return;
  }
});

board.addEventListener('click', function(e){
  if(!appState.sel) return;
  if(e.target.closest('[data-act]')) return;
  var grid = e.target.closest('.grid');
  if(!grid) return;
  placeAt(grid, e.clientY);
});

modal.addEventListener('click', function(e){
  if(e.target === modal){ closeModal(); }
});

/* ---------------- 启动 ---------------- */
appState.ops = loadOps();
fitViewport();
render();
setInterval(positionNow, 30000);

var resizeTimer = null;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    fitViewport();
    render();
  }, 120);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if(window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', onResize);
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden){ fitViewport(); positionNow(); }
});
};
</script>
<script>
(function(){
  function boot(){ try{ if(window.__jyBoot) window.__jyBoot(); }
    catch(e){ if(window.console) console.error(e); } }
  var proto = (window.location && window.location.protocol) || 'file:';
  if((proto === 'http:' || proto === 'https:') && window.fetch){
    fetch('board.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(d && d.boardId && (!window.BOARD || d.boardId !== window.BOARD.boardId)) window.BOARD = d;
        boot();
      })
      .catch(boot);
  } else { boot(); }
})();
</script>
